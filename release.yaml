# Connectors the console offers as ILM components, with the images of the ILM umbrella chart of
# platform.ilmVersion. Each image is also listed above; private ones need registry credentials and
# are left out of the image cache. database: jdbc or env selects how the connector reads the
# platform database; keys are variables holding a random key generated on the device.
# ENCRYPTION_KEY is a passphrase the connector derives its AES key from with PBKDF2: any non-empty
# string, read verbatim. Generate 32 random bytes, base64-encoded. It must never change after the
# first start, or the secrets the connector stored become unreadable.
