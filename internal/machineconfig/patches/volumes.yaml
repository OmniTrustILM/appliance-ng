# EPHEMERAL and IMAGECACHE are capped; the "data" volume takes the rest of its disk.
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
provisioning:
  maxSize: 24GiB
---
apiVersion: v1alpha1
kind: VolumeConfig
name: IMAGECACHE
provisioning:
  diskSelector:
    match: system_disk
  minSize: 8GiB
  maxSize: 8GiB
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: data
provisioning:
  diskSelector:
    match: {{ .DataSelector }}
  minSize: 8GiB
  grow: true
---
apiVersion: v1alpha1
kind: ImageCacheConfig
local:
  enabled: true
