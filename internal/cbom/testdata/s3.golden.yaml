---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: cbom-repository
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cbom-repository
    app.kubernetes.io/version: 1.2.0
    helm.sh/chart: cbom-repository-1.2.0
  name: cbom-repository-deployment
  namespace: ilm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: cbom-repository
      app.kubernetes.io/instance: cbom-repository
      app.kubernetes.io/name: cbom-repository
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cbom-repository
        app.kubernetes.io/instance: cbom-repository
        app.kubernetes.io/name: cbom-repository
    spec:
      containers:
      - env:
        - name: APP_S3_ENDPOINT
          value: https://s3.example.com
        - name: APP_S3_REGION
          value: eu-central-1
        - name: APP_S3_BUCKET
          value: cboms
        - name: APP_S3_USE_PATH_STYLE
          value: "true"
        - name: APP_S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: access_key
              name: appliance-cbom-s3
        - name: APP_S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: secret_key
              name: appliance-cbom-s3
        - name: APP_HTTP_PORT
          value: "8080"
        - name: APP_HTTP_CORS_ALLOWED_ORIGINS
          value: https://ilm.example.com
        - name: APP_LOG_LEVEL
          value: INFO
        image: hub.omnitrustregistry.com/ilm/cbom-repository@sha256:97e6510e2a024b873b9f9ef25dc1f061cc96f5c5685c91601214ca307d4e8e6b
        imagePullPolicy: IfNotPresent
        name: cbom-repository
        ports:
        - containerPort: 8080
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/v1/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        startupProbe:
          failureThreshold: 45
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /etc/ssl/certs/ca.crt
          name: trusted-certificates-volume
          readOnly: true
          subPath: ca.crt
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: trusted-certificates-volume
        secret:
          defaultMode: 420
          secretName: trusted-certificates-cbom-repository
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: cbom-repository
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cbom-repository
    app.kubernetes.io/version: 1.2.0
    helm.sh/chart: cbom-repository-1.2.0
  name: cbom-repository-service
  namespace: ilm
spec:
  ports:
  - port: 8080
    protocol: TCP
  selector:
    app.kubernetes.io/component: cbom-repository
    app.kubernetes.io/instance: cbom-repository
    app.kubernetes.io/name: cbom-repository
  type: ClusterIP
---
apiVersion: v1
data:
  ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUIKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
kind: Secret
metadata:
  name: trusted-certificates-cbom-repository
  namespace: ilm
type: Opaque
