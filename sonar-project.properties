sonar.projectKey=OmniTrustILM_appliance-ng
sonar.organization=ilm

# Source and test configuration
sonar.sources=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,out/**,addons/*.yaml,addons/src/**,config/crd/**

# Coverage
sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=cmd/*/main.go,**/zz_generated*.go
sonar.cpd.exclusions=**/zz_generated*.go
