sonar.projectKey=OmniTrustILM_appliance-ng
sonar.organization=ilm

# Source and test configuration
sonar.sources=.
sonar.test.inclusions=**/*_test.go,web/src/**/*.test.ts,web/src/**/*.test.tsx
sonar.exclusions=**/*_test.go,out/**,addons/*.yaml,addons/src/**,config/crd/**,web/src/**/*.test.ts,web/src/**/*.test.tsx,**/gen.go,web/src/api/schema.d.ts,web/node_modules/**,web/dist/**,web/coverage/**

# Coverage
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.coverage.exclusions=cmd/*/main.go,test/boot/**,**/zz_generated*.go,**/gen.go,web/src/api/schema.d.ts,web/src/main.tsx,web/src/test-setup.ts,web/*.config.js,web/*.config.ts
sonar.cpd.exclusions=**/zz_generated*.go,**/gen.go,web/src/api/schema.d.ts
