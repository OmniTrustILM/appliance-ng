# Traefik is the appliance edge: HTTPS on the node's port 443, HTTP on port 80 redirected to it by the
# lowest-priority router below, so the ACME HTTP-01 solver's route on port 80 still answers.
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
    http:
      # recommended hardening from the ILM client-certificate documentation (Traefik >= 3.7.12)
      aliasHeadersStrategy: delete
service:
  enabled: false
providers:
  kubernetesCRD: { enabled: true }
  kubernetesIngress: { enabled: true }
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
# hostPorts 80/443 allow one pod per node: replace the pod in place instead of surging a second one
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: redirect-https
      namespace: traefik
    spec:
      redirectScheme:
        scheme: https
        port: "443"
        permanent: true
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: redirect-https
      namespace: traefik
    spec:
      entryPoints: [web]
      routes:
        - match: PathPrefix(`/`)
          kind: Rule
          priority: 1
          middlewares:
            - name: redirect-https
          services:
            - name: noop@internal
              kind: TraefikService
