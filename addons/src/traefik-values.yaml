# Traefik is the appliance edge: HTTPS on the node's port 443, HTTP on port 80 redirected to it.
ports:
  web:
    hostPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    hostPort: 443
    http:
      # recommended hardening from the ILM client-certificate documentation (Traefik >= 3.7.12)
      aliasHeadersStrategy: delete
service:
  enabled: false
providers:
  kubernetesCRD: { enabled: true }
  kubernetesIngress: { enabled: true }
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik
# hostPorts 80/443 allow one pod per node: replace the pod in place instead of surging a second one
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0
