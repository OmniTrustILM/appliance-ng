# Cilium without kube-proxy against KubePrism, as in the Talos guide "Deploying Cilium CNI".
ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
l2announcements:
  enabled: true
externalIPs:
  enabled: true
operator:
  replicas: 1
# Hubble's TLS material would be generated at render time: a new key on every render,
# and the same private key in every appliance.
hubble:
  enabled: false
