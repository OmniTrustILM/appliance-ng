# The Appliance Manager. make manifests writes addons/manager.yaml from this file and the Appliance CRD.
# The first-boot service applies it after bootstrap and replaces the image placeholder (managerImage in
# release.yaml) with the manager image built with the appliance.
---
apiVersion: v1
kind: Namespace
metadata:
  name: appliance-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
# The platform namespace, so the manager's Role in it can be bound before the ilm-operator step creates it.
apiVersion: v1
kind: Namespace
metadata:
  name: ilm
---
# The ILM operator's namespace, so the manager's Role in it can be bound before the ilm-operator step creates it.
apiVersion: v1
kind: Namespace
metadata:
  name: ilm-operator-system
---
# The cert-manager namespace, so the manager's Role in it can be bound. The manager is applied first; the
# cert-manager add-on later applies the same Namespace server-side and the two merge.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
# The ServiceAccounts of the kubeconfigs the console issues and the record of the talosconfigs it issued.
apiVersion: v1
kind: Namespace
metadata:
  name: appliance-access
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: appliance-manager
  namespace: appliance-system
---
# Every kind the add-on manifests and the reconciler apply, read access for the readiness waits, and events.
# The add-ons install ClusterRoles and bindings that grant permissions the manager does not hold itself, so it needs
# escalate and bind on roles and clusterroles. With them this ServiceAccount is effectively cluster-admin, and with
# the Talos os:admin role of its talosconfig it is effectively node-admin as well.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: appliance-manager
rules:
  - apiGroups: [appliance.otilm.com]
    resources: [appliances]
    verbs: [get, list, watch, create, update, patch]
  # The reconciler's controller owner references set blockOwnerDeletion, which needs update on the owner's finalizers.
  - apiGroups: [appliance.otilm.com]
    resources: [appliances/finalizers]
    verbs: [update]
  - apiGroups: [appliance.otilm.com]
    resources: [appliances/status]
    verbs: [get, update, patch]
  - apiGroups: [otilm.com]
    resources: [platforms, connectors]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [otilm.com]
    resources: [connectors]
    verbs: [delete]
  - apiGroups: [""]
    resources: [namespaces, configmaps, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments, daemonsets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings, roles, rolebindings]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, roles]
    verbs: [escalate, bind]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [cert-manager.io]
    resources: [certificates, issuers, clusterissuers]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [traefik.io]
    resources: [middlewares, tlsoptions]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [get, list, watch, create, patch]
  # Revoking a kubeconfig the console issued deletes its binding.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterrolebindings]
    verbs: [delete]
  # An NFS backup target is mounted from a static volume the manager creates and deletes around each operation, and
  # lists to remove what an interrupted operation left.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, create, delete]
---
# The role of the view kubeconfigs the console issues: what view grants, and read access to nodes, which view leaves
# out.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: appliance-access-view
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
    - matchLabels:
        appliance.otilm.com/aggregate-to-access-view: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: appliance-access-view-nodes
  labels:
    appliance.otilm.com/aggregate-to-access-view: "true"
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: appliance-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: appliance-manager
subjects:
  - kind: ServiceAccount
    name: appliance-manager
    namespace: appliance-system
---
# The Appliance references its Secrets in appliance-system; the manager reads no other Secrets through its cache.
# It keeps the console accounts, the SMTP credentials, the uploaded certificate and a signing request's key there,
# replaces and deletes them as they change, and deletes the hand-over Secret once it imported it. It deletes its own
# Failed pods, which pile up while the node shuts down. A backup of an external database runs pg_dump in a short-lived
# pod it creates, execs into and deletes; an NFS backup target is written the same way, by a pod with a claim on the
# target's volume.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: appliance-manager
  namespace: appliance-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, create, delete, deletecollection]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: appliance-manager
  namespace: appliance-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: appliance-manager
subjects:
  - kind: ServiceAccount
    name: appliance-manager
    namespace: appliance-system
---
# Copies of the referenced Secrets and the connector key Secrets in the platform namespace. The console also reads
# the administrator certificate there and marks its Secret once handed out. The copies of the trust bundle, the
# registry credentials and the mail credentials are deleted once the Appliance no longer references them. A backup
# dumps the database by exec into the CloudNativePG primary, which it finds through its Cluster and its pods. A
# restore waits for the managed Keycloak, stops it, waits for the ILM pods to go, deletes the CertificateRequests so that
# cert-manager keeps the restored Secrets, writes those into the live Secrets and loads the dump the same way.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: appliance-manager
  namespace: ilm
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [appliance-trust, appliance-registry-credentials, appliance-mail]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    resourceNames: [ilm-db]
    verbs: [get]
  - apiGroups: [k8s.keycloak.org]
    resources: [keycloaks]
    resourceNames: [ilm-keycloak]
    verbs: [get, patch]
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: appliance-manager
  namespace: ilm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: appliance-manager
subjects:
  - kind: ServiceAccount
    name: appliance-manager
    namespace: appliance-system
---
# A restore waits for the pod of the ILM operator to be gone after scaling it to zero.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: appliance-manager
  namespace: ilm-operator-system
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: appliance-manager
  namespace: ilm-operator-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: appliance-manager
subjects:
  - kind: ServiceAccount
    name: appliance-manager
    namespace: appliance-system
---
# A backup holds the root CA of the built-in certificate chain, which cert-manager keeps in its own namespace. A
# fresh restore writes it back, after deleting its CertificateRequests so that cert-manager keeps it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: appliance-manager
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [appliance-root-ca]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [cert-manager.io]
    resources: [certificaterequests]
    verbs: [list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: appliance-manager
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: appliance-manager
subjects:
  - kind: ServiceAccount
    name: appliance-manager
    namespace: appliance-system
---
# The kubeconfigs the console issues: their tokens, as TokenRequests or the token Secrets of long-lived ones, and
# deleting their ServiceAccounts on revoke and expiry; the garbage collector deletes the token Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: appliance-manager
  namespace: appliance-access
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [delete]
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: appliance-manager
  namespace: appliance-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: appliance-manager
subjects:
  - kind: ServiceAccount
    name: appliance-manager
    namespace: appliance-system
---
# Talos creates the Secret appliance-manager in appliance-system with a talosconfig for this role.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: appliance-manager
  namespace: appliance-system
spec:
  roles:
    - os:admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appliance-manager
  namespace: appliance-system
  labels:
    app.kubernetes.io/name: appliance-manager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: appliance-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appliance-manager
    spec:
      serviceAccountName: appliance-manager
      hostNetwork: true
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
        - key: node.cilium.io/agent-not-ready
          operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # The hostPath behind /data is created root-owned and hostPath ignores fsGroup, so a root init container
      # hands it to the manager's user before the manager starts.
      initContainers:
        - name: data-owner
          image: docker.io/library/busybox:latest
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "chown 65532:65532 /data && chmod 0700 /data"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: manager
          image: appliance.invalid/manager:release
          env:
            - name: KUBERNETES_SERVICE_HOST
              value: 127.0.0.1
            - name: KUBERNETES_SERVICE_PORT
              value: "7445"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Below the memory limit, so that the garbage collector runs before the container is killed.
            - name: GOMEMLIMIT
              value: 448MiB
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            # Room for the 256 MiB scrypt of one recovery kit at a time next to the manager's own use.
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: talos-secrets
              mountPath: /var/run/secrets/talos.dev
              readOnly: true
      volumes:
        - name: data
          hostPath:
            path: /var/mnt/data/appliance
            type: DirectoryOrCreate
        - name: talos-secrets
          secret:
            secretName: appliance-manager
            optional: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: appliances.appliance.otilm.com
spec:
  group: appliance.otilm.com
  names:
    kind: Appliance
    listKind: ApplianceList
    plural: appliances
    singular: appliance
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Appliance is the single cluster-scoped resource that describes
          the whole appliance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApplianceSpec is the desired configuration of the appliance.
            properties:
              backup:
                description: BackupSpec configures the targets that receive copies
                  of the backups.
                properties:
                  targets:
                    items:
                      description: BackupTarget is a place that receives scheduled
                        backups. Exactly the block matching Type is set.
                      properties:
                        credentialsRef:
                          description: |-
                            CredentialsRef names the Secret in the appliance namespace holding the target credentials: accessKey and
                            secretKey for s3, password or privateKey for sftp.
                          type: string
                        name:
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        nfs:
                          description: NFSTarget is a directory on an NFS export.
                          properties:
                            export:
                              type: string
                            path:
                              type: string
                            server:
                              type: string
                            version:
                              enum:
                              - "3"
                              - "4.1"
                              - "4.2"
                              type: string
                          required:
                          - export
                          - server
                          type: object
                        retention:
                          description: Retention is the number of backups kept on
                            the target.
                          format: int32
                          maximum: 365
                          minimum: 1
                          type: integer
                        s3:
                          description: S3Target is an S3 compatible bucket.
                          properties:
                            bucket:
                              type: string
                            ca:
                              description: CA references the Secret key holding the
                                PEM CA bundle that signs the endpoint certificate.
                              properties:
                                key:
                                  type: string
                                name:
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                            endpoint:
                              type: string
                            prefix:
                              type: string
                            region:
                              type: string
                          required:
                          - bucket
                          - endpoint
                          type: object
                        schedule:
                          description: Schedule is a five-field cron expression; empty
                            selects the default schedule.
                          maxLength: 128
                          pattern: ^(\s*\S+(\s+\S+){4}\s*)?$
                          type: string
                        sftp:
                          description: SFTPTarget is a directory on an SFTP server.
                          properties:
                            host:
                              type: string
                            hostKey:
                              description: HostKey is the SHA256 fingerprint of the
                                server's host key, as printed by ssh-keygen -l.
                              pattern: ^SHA256:.+$
                              type: string
                            path:
                              type: string
                            port:
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                            user:
                              type: string
                          required:
                          - host
                          - hostKey
                          - path
                          - port
                          - user
                          type: object
                        timeZone:
                          description: TimeZone is the IANA time zone of Schedule;
                            empty selects the default zone.
                          maxLength: 64
                          type: string
                        type:
                          enum:
                          - s3
                          - sftp
                          - nfs
                          type: string
                      required:
                      - name
                      - retention
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: backup target s3 must be set exactly when type is
                          s3
                        rule: 'self.type == ''s3'' ? has(self.s3) : !has(self.s3)'
                      - message: backup target sftp must be set exactly when type
                          is sftp
                        rule: 'self.type == ''sftp'' ? has(self.sftp) : !has(self.sftp)'
                      - message: backup target nfs must be set exactly when type is
                          nfs
                        rule: 'self.type == ''nfs'' ? has(self.nfs) : !has(self.nfs)'
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
              dns:
                description: DNSSpec lists the DNS servers.
                properties:
                  servers:
                    items:
                      maxLength: 45
                      type: string
                      x-kubernetes-validations:
                      - message: dns.servers entries must be IP addresses
                        rule: isIP(self)
                    maxItems: 8
                    type: array
                type: object
              mail:
                description: MailSpec is the outbound SMTP configuration.
                properties:
                  credentialsRef:
                    description: CredentialsRef names the Secret holding the SMTP
                      credentials.
                    type: string
                  from:
                    type: string
                  host:
                    type: string
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  security:
                    enum:
                    - none
                    - starttls
                    - tls
                    type: string
                required:
                - from
                - host
                - port
                - security
                type: object
              node:
                description: NodeSpec is the network identity of the node.
                properties:
                  address:
                    description: Address is the node address in CIDR notation; empty
                      means DHCP.
                    maxLength: 49
                    type: string
                    x-kubernetes-validations:
                    - message: node.address must be empty or an IPv4 CIDR
                      rule: self == '' || (isCIDR(self) && cidr(self).ip().family()
                        == 4)
                  gateway:
                    maxLength: 45
                    type: string
                    x-kubernetes-validations:
                    - message: node.gateway must be empty or an IPv4 address
                      rule: self == '' || (isIP(self) && ip(self).family() == 4)
                  hostName:
                    description: |-
                      HostName is the fully qualified host name of the appliance. It is the Kubernetes node name, so it is fixed
                      once set.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)+$
                    type: string
                    x-kubernetes-validations:
                    - message: node.hostName cannot be changed once set
                      rule: self == oldSelf
                required:
                - hostName
                type: object
                x-kubernetes-validations:
                - message: node.address cannot be changed once set
                  rule: '!has(oldSelf.address) || size(oldSelf.address) == 0 || (has(self.address)
                    && self.address == oldSelf.address)'
              ntp:
                description: NTPSpec lists the NTP servers.
                properties:
                  servers:
                    items:
                      type: string
                    type: array
                type: object
              platform:
                description: PlatformSpec selects the ILM platform to install.
                properties:
                  components:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  hostName:
                    type: string
                  ilmVersion:
                    type: string
                type: object
              proxy:
                description: ProxySpec is the outbound HTTP proxy configuration.
                properties:
                  http:
                    type: string
                  https:
                    type: string
                  noProxy:
                    type: string
                type: object
              registries:
                items:
                  description: RegistrySpec is a container registry with optional
                    credentials.
                  properties:
                    credentialsRef:
                      description: CredentialsRef names the Secret holding the registry
                        credentials.
                      type: string
                    host:
                      type: string
                  required:
                  - host
                  type: object
                type: array
              tls:
                description: TLSSpec selects the certificate served by the platform.
                properties:
                  secretRef:
                    description: SecretRef names the Secret holding the certificate
                      when Source is secret.
                    type: string
                  source:
                    default: builtin
                    enum:
                    - builtin
                    - secret
                    type: string
                type: object
                x-kubernetes-validations:
                - message: tls.secretRef is required when tls.source is secret
                  rule: self.source != 'secret' || (has(self.secretRef) && size(self.secretRef)
                    > 0)
              trust:
                description: Trust references the Secret key holding the PEM bundle
                  of additional trusted CAs.
                properties:
                  key:
                    type: string
                  name:
                    type: string
                required:
                - key
                - name
                type: object
            required:
            - node
            type: object
          status:
            description: ApplianceStatus is the observed state of the appliance.
            properties:
              backup:
                description: Backup reports the local backups and the state of every
                  target.
                properties:
                  last:
                    description: Last is the most recent backup taken.
                    properties:
                      database:
                        enum:
                        - included
                        - notIncluded
                        type: string
                      name:
                        type: string
                      sizeBytes:
                        format: int64
                        type: integer
                      time:
                        format: date-time
                        type: string
                    required:
                    - database
                    - name
                    - sizeBytes
                    - time
                    type: object
                  local:
                    description: Local lists the backup copies kept on the data volume.
                    items:
                      description: BackupRecord is one backup file.
                      properties:
                        database:
                          enum:
                          - included
                          - notIncluded
                          type: string
                        name:
                          type: string
                        sizeBytes:
                          format: int64
                          type: integer
                        time:
                          format: date-time
                          type: string
                      required:
                      - database
                      - name
                      - sizeBytes
                      - time
                      type: object
                    type: array
                  running:
                    type: boolean
                  targets:
                    items:
                      description: TargetStatus is the state of a backup target.
                      properties:
