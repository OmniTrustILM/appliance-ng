                        minLength: 1
                        type: string
                      host:
                        description: Host is a host name or an IPv4 address.
                        pattern: ^[a-zA-Z0-9._-]{1,253}$
                        type: string
                      port:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      tls:
                        description: TLS connects with AMQPS to Port, verifying the
