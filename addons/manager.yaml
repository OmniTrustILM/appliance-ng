                          - unreachable
                          - authFailed
                          - hostKeyMismatch
                          - notFound
                          - noSpace
                          - timeout
                          - failed
                          type: string
                        lastSuccess:
                          format: date-time
                          type: string
                        name:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                type: object
              cluster:
                description: Cluster is the observed state of the nodes; unset until
                  the manager first reads it.
                properties:
                  addressHolder:
                    description: AddressHolder is the node that holds the virtual
                      address.
                    type: string
                  databasePrimary:
                    description: DatabasePrimary is the node that runs the PostgreSQL
                      primary.
                    type: string
                  leader:
                    description: Leader is the node that runs the leading manager.
                    type: string
                  nodes:
                    items:
                      description: NodeStatus is the observed state of one node.
