                            update of that kind finishes.
                          type: string
                        sizeBytes:
                          format: int64
                          type: integer
                        time:
                          format: date-time
                          type: string
                      required:
                      - database
                      - name
                      - sizeBytes
                      - time
                      type: object
                    type: array
                  running:
