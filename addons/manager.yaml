                            path:
                              type: string
                            server:
                              type: string
                            version:
                              enum:
                              - "3"
                              - "4.1"
                              - "4.2"
                              type: string
                          required:
                          - export
                          - server
                          type: object
                        retention:
                          description: Retention is the number of backups kept on
                            the target.
                          format: int32
                          maximum: 365
                          minimum: 1
                          type: integer
                        s3:
                          description: S3Target is an S3 compatible bucket.
                          properties:
                            bucket:
                              type: string
                            ca:
                              description: CA references the Secret key holding the
                                PEM CA bundle that signs the endpoint certificate.
                              properties:
                                key:
