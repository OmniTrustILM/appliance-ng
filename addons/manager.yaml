                            HostName is the fully qualified host name of the node. Talos registers the node in Kubernetes under the
                            first label of this name.
                          maxLength: 253
                          pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)+$
                          type: string
                        maintenance:
                          description: Maintenance marks the node as taken out of
                            service by the administrator.
                          type: boolean
                        role:
                          description: Role is set by the manager when the node joins.
                          enum:
                          - voting
                          - worker
                          type: string
                        tags:
                          description: Tags are short names that place connectors
                            on the node.
                          items:
                            pattern: ^[a-z0-9][a-z0-9-]{0,30}$
                            type: string
                          maxItems: 8
                          type: array
                          x-kubernetes-list-type: set
                      required:
                      - hostName
                      type: object
                      x-kubernetes-validations:
                      - message: a node's address cannot be changed once set
                        rule: '!has(oldSelf.address) || size(oldSelf.address) == 0
                          || (has(self.address) && self.address == oldSelf.address)'
                    maxItems: 7
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - hostName
                    x-kubernetes-list-type: map
                required:
