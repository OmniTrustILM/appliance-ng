                        pattern: ^[A-Za-z0-9_$.-]{1,63}$
                        type: string
                      port:
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      tlsMode:
                        description: |-
                          TLSMode is the sslmode of the connection; empty leaves the drivers' default, which uses TLS when the server
