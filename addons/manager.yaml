                    - host
                    - port
                    type: object
                    x-kubernetes-validations:
                    - message: messaging.ca is required exactly when tls is set
                      rule: (has(self.tls) && self.tls) == has(self.ca)
                  utils:
                    description: Utils installs the utils service.
                    type: boolean
                type: object
              proxy:
                description: ProxySpec is the outbound HTTP proxy configuration.
                properties:
                  http:
