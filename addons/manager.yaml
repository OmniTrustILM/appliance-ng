                            type: string
                          raProfileUuid:
                            type: string
                          vaultProfileUuid:
                            type: string
                          vaultUuid:
                            type: string
                        required:
                        - raProfileUuid
                        - vaultProfileUuid
                        - vaultUuid
                        type: object
                      solver:
