                      scopes:
                        items:
                          maxLength: 255
                          type: string
                        maxItems: 32
                        type: array
                    required:
                    - clientId
                    - credentialsRef
                    - issuer
                    type: object
                  ilmVersion:
                    type: string
                  messaging:
