# Traefik client-certificate login as in the ILM documentation ("Client Certificate
# Authentication", Traefik section): caller headers cleared, then PassTLSClientCert (pem) ->
# X-Forwarded-Tls-Client-Cert. The Appliance Manager applies the TLSOption ilm-mtls that asks for
# and verifies the optional client certificate, because its CA depends on the edge's TLS source.
apiVersion: v1
kind: Namespace
metadata: { name: ilm }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: clear-client-certificate, namespace: ilm }
spec:
  headers:
    customRequestHeaders:
      ssl-client-cert: ""
      X-Forwarded-Tls-Client-Cert: ""
      X-Forwarded-Tls-Client-Cert-Info: ""
      Client-Cert: ""
      Client-Cert-Chain: ""
      X-Forwarded-Client-Cert: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: forward-client-certificate, namespace: ilm }
spec:
  passTLSClientCert:
    pem: true
