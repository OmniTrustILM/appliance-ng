# Traefik client-certificate login as in the ILM documentation ("Client Certificate
# Authentication", Traefik section): optional verified client certificate, caller headers
# cleared, then PassTLSClientCert (pem) -> X-Forwarded-Tls-Client-Cert. Client certificates
# are verified against ca.crt of the Secret ca-keypair: the internal CA the operator creates
# for the edge (tls.source: internal), which also signs the generated administrator certificate.
apiVersion: v1
kind: Namespace
metadata: { name: ilm }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: clear-client-certificate, namespace: ilm }
spec:
  headers:
    customRequestHeaders:
      ssl-client-cert: ""
      X-Forwarded-Tls-Client-Cert: ""
      X-Forwarded-Tls-Client-Cert-Info: ""
      Client-Cert: ""
      Client-Cert-Chain: ""
      X-Forwarded-Client-Cert: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: { name: forward-client-certificate, namespace: ilm }
spec:
  passTLSClientCert:
    pem: true
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata: { name: ilm-mtls, namespace: ilm }
spec:
  clientAuth:
    clientAuthType: VerifyClientCertIfGiven
    secretNames: [ca-keypair]
