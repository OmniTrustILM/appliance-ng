---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: appliances.appliance.otilm.com
spec:
  group: appliance.otilm.com
  names:
    kind: Appliance
    listKind: ApplianceList
    plural: appliances
    singular: appliance
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Appliance is the single cluster-scoped resource that describes
          the whole appliance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApplianceSpec is the desired configuration of the appliance.
            properties:
              dns:
                description: DNSSpec lists the DNS servers.
                properties:
                  servers:
                    items:
                      maxLength: 45
                      type: string
                      x-kubernetes-validations:
                      - message: dns.servers entries must be IP addresses
                        rule: isIP(self)
                    maxItems: 8
                    type: array
                type: object
              mail:
                description: MailSpec is the outbound SMTP configuration.
                properties:
                  credentialsRef:
                    description: CredentialsRef names the Secret holding the SMTP
                      credentials.
                    type: string
                  from:
                    type: string
                  host:
                    type: string
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  security:
                    enum:
                    - none
                    - starttls
                    - tls
                    type: string
                required:
                - from
                - host
                - port
                - security
                type: object
              node:
                description: NodeSpec is the network identity of the node.
                properties:
                  address:
                    description: Address is the node address in CIDR notation; empty
                      means DHCP.
                    maxLength: 49
                    type: string
                    x-kubernetes-validations:
                    - message: node.address must be empty or an IPv4 CIDR
                      rule: self == '' || (isCIDR(self) && cidr(self).ip().family()
                        == 4)
                  gateway:
                    maxLength: 45
                    type: string
                    x-kubernetes-validations:
                    - message: node.gateway must be empty or an IPv4 address
                      rule: self == '' || (isIP(self) && ip(self).family() == 4)
                  hostName:
                    description: |-
                      HostName is the fully qualified host name of the appliance. It is the Kubernetes node name, so it is fixed
                      once set.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)+$
                    type: string
                    x-kubernetes-validations:
                    - message: node.hostName cannot be changed once set
                      rule: self == oldSelf
                required:
                - hostName
                type: object
                x-kubernetes-validations:
                - message: node.address cannot be changed once set
                  rule: '!has(oldSelf.address) || size(oldSelf.address) == 0 || (has(self.address)
                    && self.address == oldSelf.address)'
              ntp:
                description: NTPSpec lists the NTP servers.
                properties:
                  servers:
                    items:
                      type: string
                    type: array
                type: object
              platform:
                description: PlatformSpec selects the ILM platform to install.
                properties:
                  components:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  hostName:
                    type: string
                  ilmVersion:
                    type: string
                type: object
              proxy:
                description: ProxySpec is the outbound HTTP proxy configuration.
                properties:
                  http:
                    type: string
                  https:
                    type: string
                  noProxy:
                    type: string
                type: object
              registries:
                items:
                  description: RegistrySpec is a container registry with optional
                    credentials.
                  properties:
                    credentialsRef:
                      description: CredentialsRef names the Secret holding the registry
                        credentials.
                      type: string
                    host:
                      type: string
                  required:
                  - host
                  type: object
                type: array
              tls:
                description: TLSSpec selects the certificate served by the platform.
                properties:
                  secretRef:
                    description: SecretRef names the Secret holding the certificate
                      when Source is secret.
                    type: string
                  source:
                    default: builtin
                    enum:
                    - builtin
                    - secret
                    type: string
                type: object
                x-kubernetes-validations:
                - message: tls.secretRef is required when tls.source is secret
                  rule: self.source != 'secret' || (has(self.secretRef) && size(self.secretRef)
                    > 0)
              trust:
                description: Trust references the Secret key holding the PEM bundle
                  of additional trusted CAs.
                properties:
                  key:
                    type: string
                  name:
                    type: string
                required:
                - key
                - name
                type: object
            required:
            - node
            type: object
          status:
            description: ApplianceStatus is the observed state of the appliance.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              nodeAddress:
                type: string
              observedGeneration:
                format: int64
                type: integer
              rebootRequired:
                type: boolean
              setup:
                enum:
                - part1
                - part2
                - complete
                type: string
              versions:
                description: Versions are the component versions running on the appliance.
                properties:
                  appliance:
                    type: string
                  ilm:
                    type: string
                  kubernetes:
                    type: string
                  operator:
                    type: string
                  talos:
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the Appliance must be named appliance
          rule: self.metadata.name == 'appliance'
    served: true
    storage: true
    subresources:
      status: {}
