                      rule: 'self.storage == ''s3'' ? has(self.s3) && has(self.credentialsRef)
                        && size(self.credentialsRef) > 0 : !has(self.s3) && (!has(self.credentialsRef)
                        || size(self.credentialsRef) == 0)'
                  components:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  database:
                    description: Database is the external database ILM uses; unset
