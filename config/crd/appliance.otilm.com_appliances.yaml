                          profileName:
                            default: appliance
                            description: ProfileName is the name of the ACME profile
                              in ILM.
                            type: string
                          raProfileUuid:
                            type: string
                          vaultProfileUuid:
                            type: string
                          vaultUuid:
                            type: string
                        required:
                        - raProfileUuid
                        - vaultProfileUuid
                        - vaultUuid
                        type: object
                      solver:
