                    type: array
                type: object
              platform:
                description: PlatformSpec selects the ILM platform to install.
                properties:
                  cbom:
                    description: CBOM installs the CBOM repository ILM keeps CBOMs
                      in.
                    properties:
                      credentialsRef:
                        description: |-
                          CredentialsRef names the Secret in the appliance namespace holding accessKey and secretKey of the external
                          bucket.
                        type: string
                      enabled:
                        type: boolean
                      s3:
                        description: S3 is the external bucket; its Prefix is not
                          used.
                        properties:
                          bucket:
                            type: string
                          ca:
                            description: CA references the Secret key holding the
                              PEM CA bundle that signs the endpoint certificate.
                            properties:
                              key:
                                type: string
                              name:
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          endpoint:
                            type: string
                          prefix:
                            type: string
                          region:
                            type: string
                        required:
                        - bucket
                        - endpoint
                        type: object
                      storage:
                        description: 'Storage is the S3 store of the CBOMs: one on
