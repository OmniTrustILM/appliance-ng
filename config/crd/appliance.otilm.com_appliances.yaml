                              properties:
                                key:
                                  type: string
                                name:
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                            endpoint:
                              type: string
                            prefix:
                              type: string
                            region:
                              type: string
                          required:
                          - bucket
                          - endpoint
                          type: object
                        schedule:
                          description: Schedule is a five-field cron expression; empty
                            selects the default schedule.
                          maxLength: 128
                          pattern: ^(\s*\S+(\s+\S+){4}\s*)?$
                          type: string
                        sftp:
                          description: SFTPTarget is a directory on an SFTP server.
                          properties:
                            host:
                              type: string
                            hostKey:
                              description: HostKey is the SHA256 fingerprint of the
                                server's host key, as printed by ssh-keygen -l.
                              pattern: ^SHA256:.+$
                              type: string
                            path:
                              type: string
                            port:
                              format: int32
                              maximum: 65535
                              minimum: 1
                              type: integer
                            user:
                              type: string
                          required:
                          - host
                          - hostKey
                          - path
                          - port
                          - user
                          type: object
                        timeZone:
                          description: TimeZone is the IANA time zone of Schedule;
                            empty selects the default zone.
                          maxLength: 64
                          type: string
                        type:
                          enum:
                          - s3
                          - sftp
                          - nfs
                          type: string
                      required:
                      - name
                      - retention
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: backup target s3 must be set exactly when type is
