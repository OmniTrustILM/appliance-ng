---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: appliances.appliance.otilm.com
spec:
  group: appliance.otilm.com
  names:
    kind: Appliance
    listKind: ApplianceList
    plural: appliances
    singular: appliance
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Appliance is the single cluster-scoped resource that describes
          the whole appliance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ApplianceSpec is the desired configuration of the appliance.
            properties:
              backup:
                description: BackupSpec configures the targets that receive copies
                  of the backups.
                properties:
                  targets:
                    items:
                      description: BackupTarget is a place that receives scheduled
                        backups. Exactly the block matching Type is set.
                      properties:
                        credentialsRef:
                          description: |-
                            CredentialsRef names the Secret in the appliance namespace holding the target credentials: accessKey and
                            secretKey for s3, password or privateKey for sftp.
                          type: string
                        name:
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        nfs:
                          description: NFSTarget is a directory on an NFS export.
                          properties:
                            export:
