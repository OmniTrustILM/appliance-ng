name: firstboot
container:
  entrypoint: ./firstboot
  mounts:
    - source: /dev
      destination: /dev
      type: bind
      options: [rbind, rshared, rw]
    - source: /system/run/machined
      destination: /system/run/machined
      type: bind
      options: [rbind, rshared, rw]
  security:
    maskedPaths: []
    readonlyPaths: []
depends: []
restart: always
logToConsole: true
