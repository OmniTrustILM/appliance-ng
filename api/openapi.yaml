openapi: 3.0.3
info:
  title: ILM Appliance API
  version: v1
  description: |
    The API of the ILM appliance. Operations tagged `setup` are served by the first-boot service during wizard
    part 1; all other operations are served by the Appliance Manager.

    Every request after the session is established sends the session cookie. Requests other than GET, HEAD and
    OPTIONS also send the session's CSRF token in the `X-CSRF-Token` header. Errors are JSON objects with a
    machine-readable `code`, a human-readable `message` and, for a field that failed validation, its `field`.
    No response carries a secret, except the TOTP enrolment response, which returns the seed once.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: /appliance/api/v1
    description: The console and its API are served under /appliance/.
tags:
  - name: setup
    description: Wizard part 1, served by the first-boot service.
  - name: session
    description: Sign-in and sign-out of the console.
  - name: status
    description: The state of the appliance.
  - name: appliance
    description: The configuration of the appliance.
  - name: wizard
    description: Wizard part 2.
  - name: catalogue
    description: The platform components that can be installed.
  - name: audit
    description: The audit log.
  - name: certificate
    description: The appliance's TLS certificate and its built-in certificate authority.
  - name: platform
    description: The installed ILM platform.
  - name: node
    description: The network settings of the node.
  - name: system
    description: Reboot and shutdown of the appliance.
  - name: trust
    description: The CA certificates the platform and the node trust in addition to the public ones.
  - name: registries
    description: The container registries the platform and the node pull images from with credentials.
  - name: mail
    description: The mail server the platform sends notifications through.
  - name: access
    description: Kubeconfigs and talosconfigs for administrators of the cluster and the node.
  - name: recovery
    description: >-
      The recovery kit: the backup key, break-glass credentials for the cluster and the node and the appliance
      identity, in one file encrypted with a passphrase.
  - name: backups
    description: The encrypted backups, kept on the data volume and copied to S3, SFTP and NFS targets on a schedule.
  - name: restore
    description: >-
      The restore of a backup: onto a fresh appliance from an upload or a target, or in place from a local backup.
  - name: updates
    description: >-
      The signed system and platform bundles: those found online that are newer than what runs, and those loaded into
      the appliance's registry and data volume from an upload or online.
paths:
  /setup/code:
    post:
      tags: [setup]
      operationId: postSetupCode
      summary: Start the setup session with the one-time setup code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupCode'
      responses:
        '200':
          description: The code is valid; the response sets the session cookie.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Locked'
        '409':
          $ref: '#/components/responses/Conflict'
  /setup/state:
    get:
      tags: [setup]
      operationId: getSetupState
      summary: The step wizard part 1 resumes from
      description: With a valid setup session the response also carries the session's CSRF token.
      responses:
        '200':
          description: The current step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupState'
  /setup/mode:
    put:
      tags: [setup]
      operationId: putSetupMode
      summary: Choose a new appliance or the restore of a backup
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupMode'
      responses:
        '204':
          description: The choice is saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /setup/admin:
    put:
      tags: [setup]
      operationId: putSetupAdmin
      summary: Set the first administrator
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccount'
      responses:
        '204':
          description: The administrator is saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /setup/totp:
    post:
      tags: [setup]
      operationId: postSetupTotp
      summary: Enrol the administrator's TOTP authenticator
      description: Returns the seed once; a second request is refused.
      security:
        - session: []
      responses:
        '200':
          description: The TOTP seed and its otpauth URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrolment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /setup/totp/confirm:
    post:
      tags: [setup]
      operationId: postSetupTotpConfirm
      summary: Confirm the enrolment with a code from the authenticator
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '204':
          description: The authenticator is confirmed.
        '400':
          $ref: '#/components/responses/BadRequestWithServerTime'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /setup/node:
    put:
      tags: [setup]
      operationId: putSetupNode
      summary: Set the network settings of the node
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeSettings'
      responses:
        '204':
          description: The network settings are saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /setup/dhcp:
    get:
      tags: [setup]
      operationId: getSetupDhcp
      summary: The values DHCP delivered, to prefill the network settings
      security:
        - session: []
      responses:
        '200':
          description: The DHCP-delivered values; a value DHCP did not deliver is absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DhcpSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /setup/apply:
    post:
      tags: [setup]
      operationId: postSetupApply
      summary: Apply the saved settings and finish wizard part 1
      security:
        - session: []
      responses:
        '202':
          description: The settings are being applied.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /session:
    get:
      tags: [session]
      operationId: getSession
      summary: The signed-in user and the session's CSRF token
      security:
        - session: []
      responses:
        '200':
          description: The session is valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [session]
      operationId: postSession
      summary: Sign in with user name, password and TOTP code
      description: |
        A failed sign-in does not tell which factor failed: whatever was wrong, the answer is 400 with code
        `invalid_credentials` and the appliance time. 401 is answered only while failed attempts lock sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
      responses:
        '200':
          description: Signed in; the response sets the session cookie.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '400':
          $ref: '#/components/responses/SignInFailed'
        '401':
          $ref: '#/components/responses/SignInLocked'
    delete:
      tags: [session]
      operationId: deleteSession
      summary: Sign out
      security:
        - session: []
      responses:
        '204':
          description: Signed out; the response clears the session cookie.
          headers:
            Set-Cookie:
              description: The cookie that clears the session cookie.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /status:
    get:
      tags: [status]
      operationId: getStatus
      summary: The state of the appliance
      security:
        - session: []
      parameters:
        - name: X-Background-Refresh
          in: header
          required: false
          description: 1 marks a read the console makes on its own, which does not keep the session from going idle.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: The state of the appliance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /appliance:
    get:
      tags: [appliance]
      operationId: getAppliance
      summary: The configuration of the appliance, without secret values
      security:
        - session: []
      responses:
        '200':
          description: The configuration; a secret is reported only as set or not set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplianceSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /wizard/platform:
    put:
      tags: [wizard]
      operationId: putWizardPlatform
      summary: Set the platform host name, its components and the mail server
      description: |
        Replaces the platform settings and the mail server; without `mail` the mail server is removed. The ILM
        version is always the one the release ships. The mail password is kept in a Secret. Without `password`
        the stored one is kept only while the user name, host, port and security are unchanged; otherwise the
        answer is 400 with field `mail.password`. Credentials need security `starttls` or `tls`, otherwise the answer
        is 400 with field `mail.username`. Accepted until setup is complete, then answered with 409.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettings'
      responses:
        '202':
          description: The platform is being installed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /catalogue:
    get:
      tags: [catalogue]
      operationId: getCatalogue
      summary: The platform components that can be installed
      security:
        - session: []
      responses:
        '200':
          description: The components.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalogue'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /audit:
    get:
      tags: [audit]
      operationId: getAudit
      summary: The audit entries, newest first, a page at a time
      description: >-
        Without `before`, the page starts at the newest entry. The `next` cursor of a page asks for the entries
        written before its last one; new entries do not shift the pages that follow a cursor.
      security:
        - session: []
      parameters:
        - name: before
          in: query
          required: false
          description: >-
            The `next` cursor of the previous page; the page starts at the entry written before that page's last one.
            A cursor whose entries the rotation of the log dropped gives an empty page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: The maximum number of entries.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: The audit entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /readiness:
    get:
      tags: [status]
      operationId: getReadiness
      summary: Whether the console accepts a sign-in
      description: Public, so it needs no session. The setup page asks it while the appliance installs and starts.
      responses:
        '200':
          description: Whether signing in works.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /ca.pem:
    get:
      tags: [certificate]
      operationId: getCaPem
      summary: The root certificate of the built-in certificate authority
      description: Public, so it needs no session. Browsers and clients import it to trust the built-in certificate.
      responses:
        '200':
          description: The root certificate in PEM.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/x-pem-file:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /certificate:
    get:
      tags: [certificate]
      operationId: getCertificate
      summary: The TLS certificate the appliance serves
      description: |
        Where the certificate comes from, whether a signing request waits for its certificate and, once the
        certificate exists, its subject, names, issuer and validity. Never a private key.
      security:
        - session: []
      responses:
        '200':
          description: The certificate in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [certificate]
      operationId: putCertificate
      summary: Upload a certificate and its private key
      description: |
        Replaces the built-in certificate with the uploaded one. The certificate must match the key, be valid now,
        cover the node host name and the ILM host name, not be self-signed, chain to a root certificate (included
        in the upload, publicly trusted or one of the trusted CAs) and use an RSA key of at least 2048 bits or an
        ECDSA key. Otherwise the upload is answered with 400, a message that names the problem, and the current
        certificate stays in use. The node address need not be covered; without it the console is reachable only
        by its host name.
        A successful upload discards a pending signing request. The request body is limited to 1 MiB.
      security:
        - session: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CertificateUpload'
      responses:
        '202':
          description: The certificate is stored; the console and the platform switch to it shortly.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /certificate/csr:
    post:
      tags: [certificate]
      operationId: postCertificateCsr
      summary: Create a certificate signing request
      description: |
        Generates an ECDSA P-256 key that never leaves the appliance and returns a signing request for the node
        host name and the ILM host name. It asks for no IP address, so that a public CA can sign it; the console is
        then reachable only by its host name. A new request replaces a pending one and its key.
      security:
        - session: []
      responses:
        '200':
          description: The signing request in PEM.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/x-pem-file:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /certificate/csr/signed:
    put:
      tags: [certificate]
      operationId: putCertificateCsrSigned
      summary: Upload the certificate issued for the pending signing request
      description: |
        The certificate must have been issued for the pending signing request's key and pass the same checks as an
        uploaded certificate; otherwise it is answered with 400 and the current certificate stays in use. Without a
        pending request it is answered with 409. The request body is limited to 1 MiB.
      security:
        - session: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignedCertificateUpload'
      responses:
        '202':
          description: The certificate is stored; the console and the platform switch to it shortly.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /certificate/builtin:
    put:
      tags: [certificate]
      operationId: putCertificateBuiltin
      summary: Go back to the built-in certificate
      description: Selects the built-in certificate and deletes the uploaded certificate and a pending signing request.
      security:
        - session: []
      responses:
        '202':
          description: The console and the platform switch to the built-in certificate shortly.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /certificate/acme:
    put:
      tags: [certificate]
      operationId: putCertificateAcme
      summary: Get the certificate from an ACME server
      description: |
        Selects an automatic certificate, requested from an ACME server of your own or from the ACME profile of this
        appliance's ILM. Answered with 400 and a message that names the problem when the directory is not an https
        URL, neither or both of `directoryUrl` and `ilm` are given, the external account binding lacks its key ID or
        HMAC key, or the DNS provider or one of its settings is unknown or missing. The HMAC key and the DNS
        credentials are stored as Secrets and never returned. The uploaded certificate and a pending signing request
        stay until the built-in certificate is selected.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcmeSettings'
      responses:
        '202':
          description: The settings are stored; the platform requests the certificate shortly.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /certificate/acme/ilm-options:
    get:
      tags: [certificate]
      operationId: getCertificateAcmeIlmOptions
      summary: The RA profiles and vault profiles of ILM for its ACME profile
      description: |
        Lists the enabled RA profiles that can issue the certificate and the enabled vault profiles that can hold
        the ACME account key. Answered with 409 while ILM is not ready or does not answer.
      security:
        - session: []
      responses:
        '200':
          description: The profiles to choose from.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcmeIlmOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/admin-credential:
    post:
      tags: [platform]
      operationId: postPlatformAdminCredential
      summary: Download the ILM administrator's certificate and key, once
      description: |
        Returns the certificate and private key the platform generated for the ILM administrator as a PKCS#12 file
        encrypted with the password of the request. Each certificate is handed out once; later requests are answered
        with 410 until the platform renews the certificate. A renewed certificate is answered with 404 `not_registered`
        until ILM's administrator holds it.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCredentialRequest'
      responses:
        '200':
          description: The PKCS#12 file.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/x-pkcs12:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /platform/admin-password:
    post:
      tags: [platform]
      operationId: postPlatformAdminPassword
      summary: Show the ILM administrator's password, once
      description: |
        Returns the user name and password of the ILM administrator in the managed Keycloak. Each password is shown
        once; later requests are answered with 410 until a new password is set. Answered with 404 before the
        password exists and with 409 `external_identity` when ILM signs users in with an external identity provider.
      security:
        - session: []
      responses:
        '200':
          description: The administrator's user name and password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPassword'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
    put:
      tags: [platform]
      operationId: putPlatformAdminPassword
      summary: Set a new password for the ILM administrator
      description: |
        Generates a new password, sets it in the managed Keycloak and returns it; it is not shown again. Answered with
        409 `not_ready` while the platform is not ready, with 409 `backup_running` while a backup runs,
        `bundle_loading` while an update or a bundle load runs, with 409 `reset_running` while another new password is being set, and with 409 `external_identity` when ILM signs users
        in with an external identity provider. When Keycloak refuses or does not answer, the request is answered with
        502 and the stored password stays as it was.
      security:
        - session: []
      responses:
        '200':
          description: The administrator's user name and new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPassword'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: Keycloak refused the new password or did not answer; the message is fixed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /node:
    put:
      tags: [node]
      operationId: putNode
      summary: Change the gateway, DNS and NTP servers and proxy of the node
      description: |
        Replaces the node settings; without `proxy` the proxy is removed. The node address and host name are fixed
        at setup: a request with `address` is answered with 400 and field `address`, one with a `hostName` other
        than the current one with 400 and field `hostName`. The public name of ILM changes through
        `PUT /platform` and the certificate. A gateway needs a static address. The manager applies the change
        to the node without a reboot; a changed proxy takes effect only after a reboot, which `rebootRequired` in
        the status reports.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeUpdate'
      responses:
        '202':
          description: The node settings are being applied.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /system/reboot:
    post:
      tags: [system]
      operationId: postSystemReboot
      summary: Reboot the appliance
      description: The request must confirm the reboot with `confirm` set to true; otherwise it is answered with 400.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Confirmation'
      responses:
        '202':
          description: The appliance reboots.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /system/shutdown:
    post:
      tags: [system]
      operationId: postSystemShutdown
      summary: Shut the appliance down
      description: The request must confirm the shutdown with `confirm` set to true; otherwise it is answered with 400.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Confirmation'
      responses:
        '202':
          description: The appliance shuts down.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /trust:
    get:
      tags: [trust]
      operationId: getTrust
      summary: The additional trusted CA certificates
      description: The CA certificates the platform and the node trust in addition to the public ones, in bundle order.
      security:
        - session: []
      responses:
        '200':
          description: The trusted certificates; empty when there are none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedCertificateList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags: [trust]
      operationId: postTrust
      summary: Add trusted CA certificates
      description: |
        Adds the CA certificates of the upload to the bundle; a certificate already trusted is not added again. Only
        CA certificates are accepted: an upload with another certificate, or anything but certificates, is answered
        with 400 and a message that names the problem, and nothing is added. The manager passes the bundle on to the
        platform and the node; the node uses it after a reboot, which `rebootRequired` in the status reports. The
        request body is limited to 1 MiB.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustUpload'
      responses:
        '202':
          description: The certificates are trusted; the platform and the node follow shortly.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /trust/preview:
    post:
      tags: [trust]
      operationId: postTrustPreview
      summary: Preview adding trusted CA certificates
      description: |
        The bundle the upload would give, without changing anything: every certificate, those the upload adds marked
        `new`. An upload that adding would refuse is answered with 400 the same way. The request body is limited to
        1 MiB.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustUpload'
      responses:
        '200':
          description: The certificates of the bundle after the upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedCertificateList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /trust/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        description: The SHA-256 fingerprint of the certificate, as listed.
        schema:
          type: string
    delete:
      tags: [trust]
      operationId: deleteTrust
      summary: Stop trusting a CA certificate
      description: Removes the certificate from the bundle; removing the last one leaves no additional trusted certificates.
      security:
        - session: []
      responses:
        '202':
          description: The certificate is no longer trusted; the platform and the node follow shortly.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /registries:
    get:
      tags: [registries]
      operationId: getRegistries
      summary: The container registries
      description: The registries and the user names of their credentials. Passwords are reported only as set or not set.
      security:
        - session: []
      responses:
        '200':
          description: The registries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /registries/{host}:
    parameters:
      - name: host
        in: path
        required: true
        description: The registry's host name or IP address with an optional port, such as registry.example.com:5000.
        schema:
          type: string
    get:
      tags: [registries]
      operationId: getRegistry
      summary: A container registry
      description: The registry and the user name of its credentials. The password is reported only as set or not set.
      security:
        - session: []
      responses:
        '200':
          description: The registry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryCredentials'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      tags: [registries]
      operationId: putRegistry
      summary: Add a registry or change its credentials
      description: |
        Sets the credentials the platform and the node pull images from the registry with. Without `password` the
        stored password is kept, but only for the same user name; otherwise the request is answered with 400 and
        field `password`. The host is a host name or IP address with an optional port, without a scheme or path.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryCredentialsUpdate'
      responses:
        '202':
          description: The credentials are stored; the platform and the node follow shortly.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [registries]
      operationId: deleteRegistry
      summary: Remove a registry and its credentials
      description: |
        Removes the registry and deletes its credentials. While a chosen private component pulls from the registry,
        the request is answered with 409 and code `registry_in_use`, naming the component.
      security:
        - session: []
      responses:
        '202':
          description: The registry is removed; the platform and the node follow shortly.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform:
    get:
      tags: [platform]
      operationId: getPlatform
      summary: The ILM platform and the components that can be installed
      description: |
        The ILM version, the platform host name and every component of the catalogue, with whether it is chosen
        and what it still needs before it can be chosen.
      security:
        - session: []
      responses:
        '200':
          description: The platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      tags: [platform]
      operationId: putPlatform
      summary: Change the platform host name and its components
      description: |
        Replaces the platform host name and the chosen components. The ILM version is the installed one and cannot
        be changed: a request with another `ilmVersion` is answered with 400 and field `ilmVersion`. A private
        component needs credentials for the registry of its image, and a component that sends mail needs the mail
        settings; otherwise the request is answered with 400 and field `components`, naming the component. While an
        uploaded certificate is in use, a new host name it does not cover is answered with 400 and field `hostName`.
        Once setup is complete a dependency cannot switch between managed and external, which moves its data: the
        answer is 400 with field `dependencies.<kind>.mode`, and the switch is done by a backup, a fresh appliance
        with the new choice and a restore. The connection details and credentials of an external one stay editable.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformUpdate'
      responses:
        '202':
          description: The platform follows shortly.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /platform/dependencies/test:
    post:
      tags: [platform]
      operationId: postDependencyTest
      summary: Test the connection to an external dependency
      description: |
        Checks the settings entered for an external dependency; nothing is saved. A database is checked by a
        session that runs `SELECT 1` from a short-lived pod, a message broker by an authenticated AMQP 0-9-1
        connection to its virtual host, an identity provider by its discovery document, whose `issuer` must match
        and which must name `jwks_uri`. Without `password` the stored one is used while the server, its TLS
        setting and the user name are unchanged; otherwise the answer is 400 with field `settings.password`. A failure is reported with a
        fixed reason.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DependencyTest'
      responses:
        '200':
          description: The result of the test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyTestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /mail:
    get:
      tags: [mail]
      operationId: getMail
      summary: The mail server
      description: The mail server settings, without `mail` when none is set. The password is reported only as set or not set.
      security:
        - session: []
      responses:
        '200':
          description: The mail server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      tags: [mail]
      operationId: putMail
      summary: Set the mail server
      description: |
        Sets the mail server the platform sends notifications through. The password is kept in a Secret. Without
        `password` the stored one is kept only while the user name, host, port and security are unchanged;
        otherwise the answer is 400 with field `password`. Without `username` no credentials are used; credentials
        need security `starttls` or `tls`, otherwise the answer is 400 with field `username`.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mail'
      responses:
        '202':
          description: The mail server is set; the platform follows shortly.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [mail]
      operationId: deleteMail
      summary: Remove the mail server and its credentials
      description: Refused with 409 while a chosen component sends mail.
      security:
        - session: []
      responses:
        '202':
          description: The mail server is removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /mail/test:
    post:
      tags: [mail]
      operationId: postMailTest
      summary: Send a test mail through the mail server
      description: |
        Sends a test mail to `to` through the stored mail server, trusting the public CAs and the additional trusted
        CAs. A failure is answered with 502 and the stage that failed; the server's reply is never passed on.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailTest'
      responses:
        '204':
          description: The mail server accepted the test mail.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: The test mail could not be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailTestFailure'
  /access:
    get:
      tags: [access]
      operationId: getAccess
      summary: The issued kubeconfigs and the talosconfigs that have not expired
      description: |
        The kubeconfigs that can still be revoked and a record of the talosconfigs issued, which cannot be revoked
        and are listed until they expire. Never a token, certificate or key.
      security:
        - session: []
      responses:
        '200':
          description: The issued credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /access/kubeconfig:
    post:
      tags: [access]
      operationId: postAccessKubeconfig
      summary: Issue a kubeconfig
      description: |
        Issues a kubeconfig for the cluster with the `view` or `cluster-admin` role. With `hours` (1 to 24) its
        token expires after that time; without `hours` it is long-lived and needs a `name`. A name that is taken is
        answered with 409. The appliance does not keep the file.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KubeconfigRequest'
      responses:
        '200':
          description: The kubeconfig.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /access/kubeconfig/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The name of the kubeconfig, as listed.
        schema:
          type: string
    delete:
      tags: [access]
      operationId: deleteAccessKubeconfig
      summary: Revoke a kubeconfig
      description: >-
        Its token stops working at once. The break-glass kubeconfig of the recovery kit is answered with 409; issuing
        the recovery kit again revokes it.
      security:
        - session: []
      responses:
        '204':
          description: The kubeconfig is revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /access/talosconfig:
    post:
      tags: [access]
      operationId: postAccessTalosconfig
      summary: Issue a talosconfig
      description: |
        Issues a talosconfig for the node with the `os:reader` or `os:admin` role, valid for `hours` (1 to 8). A
        talosconfig cannot be revoked; it is listed until it expires. The appliance does not keep the file.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TalosconfigRequest'
      responses:
        '200':
          description: The talosconfig.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /recovery-kit:
    get:
      tags: [recovery]
      operationId: getRecoveryKit
      summary: Whether the recovery kit is issued and confirmed
      description: Never the backup key or the passphrase; the appliance keeps only the public key the backups are encrypted to.
      security:
        - session: []
      responses:
        '200':
          description: The state of the recovery kit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryKit'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [recovery]
      operationId: postRecoveryKit
      summary: Issue the recovery kit
      description: |
        Generates the backup key pair and issues the recovery kit: a tar of the backup private key, a break-glass
        kubeconfig with the `cluster-admin` role, a talosconfig with the `os:admin` role valid for a year, the
        appliance identity and a README, encrypted with the passphrase using the age scrypt recipient. The appliance
        keeps only the public key. Answered with 409 once a kit was issued; use reissue or replace instead. The
        passphrase has at least 12 characters and is not one of the most common passwords.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryKitRequest'
      responses:
        '200':
          $ref: '#/components/responses/RecoveryKitFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /recovery-kit/reissue:
    post:
      tags: [recovery]
      operationId: postRecoveryKitReissue
      summary: Issue the recovery kit again with the same backup key
      description: |
        Opens the uploaded kit with its passphrase and issues a new kit with the same backup key, a new passphrase
        and new break-glass credentials; the earlier break-glass kubeconfig stops working. A wrong passphrase is
        answered with 400, a kit whose key is not the appliance's backup key with 409. The request body is limited
        to 1 MiB. The new kit counts as confirmed only once confirmed again.
      security:
        - session: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecoveryKitReissue'
      responses:
        '200':
          $ref: '#/components/responses/RecoveryKitFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /recovery-kit/replace:
    post:
      tags: [recovery]
      operationId: postRecoveryKitReplace
      summary: Replace a lost recovery kit with a new backup key
      description: |
        Generates a new backup key pair and issues a kit with it and new break-glass credentials. Backups made
        before stay readable only with the key of the lost kit. Needs `confirm` set to true. The new kit counts as
        confirmed only once confirmed again.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryKitReplace'
      responses:
        '200':
          $ref: '#/components/responses/RecoveryKitFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /recovery-kit/confirm:
    post:
      tags: [recovery]
      operationId: postRecoveryKitConfirm
      summary: Confirm that the recovery kit is stored safely
      description: |
        Confirms the kit with the given issuance, which must be the latest: answered with 409 and code
        `kit_superseded` when the kit was issued again or replaced since, and the latest kit must be downloaded first.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryKitConfirm'
      responses:
        '204':
          description: The kit is confirmed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /backups:
    get:
      tags: [backups]
      operationId: getBackups
      summary: The local backups and the backup targets
      description: |
        The local backups, newest first, the last backup, whether one runs, the targets with their health, the
        BackupHealthy condition and when a restore test last succeeded. Target secrets are reported only as set or
        not set.
      security:
        - session: []
      parameters:
        - name: X-Background-Refresh
          in: header
          required: false
          description: 1 marks a read the console makes on its own, which does not keep the session from going idle.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: The backups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backups'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags: [backups]
      operationId: postBackups
      summary: Back up now
      description: |
        Starts a backup copied to every target and answers before it ends; the status and the audit log record how
        it ends. A backup that may not start is answered with 409: `backup_running`, `bundle_loading`, `no_recovery_kit`,
        `upgrade_in_progress`, `restore_in_progress` (a restore runs, waits for its kit or failed before it was done)
        or `no_space`.
      security:
        - session: []
      responses:
        '202':
          description: The backup started.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/BackupsUnavailable'
  /backups/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The file name of a local backup.
        schema:
          type: string
    get:
      tags: [backups]
      operationId: getBackup
      summary: Download a local backup
      description: The encrypted backup file, streamed; only names of the local list are served. Every download is audited.
      security:
        - session: []
      responses:
        '200':
          description: The backup file, encrypted to the backup key of the recovery kit.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/BackupsUnavailable'
  /backups/targets/hostkey:
    post:
      tags: [backups]
      operationId: postBackupHostKey
      summary: Read the host key of an SSH server
      description: |
        Connects to the SSH server through the appliance's proxy and returns the SHA256 fingerprint of its host key
        without signing in, for the administrator to compare and accept. A failure is answered with 502 and a fixed
        reason as its code. Every scan is audited with the host and port.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostKeyRequest'
      responses:
        '200':
          description: The host key's fingerprint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          description: The server could not be reached or sent no host key; the code is a fixed reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/BackupsUnavailable'
  /backups/targets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: The target's name, a DNS label.
        schema:
          type: string
    get:
      tags: [backups]
      operationId: getBackupTarget
      summary: A backup target
      description: The target, its health and which secrets are set; never a secret.
      security:
        - session: []
      responses:
        '200':
          description: The target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupTarget'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      tags: [backups]
      operationId: putBackupTarget
      summary: Add a backup target or replace its settings
      description: |
        Sets the target. The schedule is a five-field cron expression, `0 2 * * *` by default, in `timeZone`, an
        IANA zone name; the retention is 14 by default and the NFS version 4.1. Secrets are write-only and stored in
        a Secret: an S3 target needs `accessKey` and `secretKey`, an SFTP target `password` or `privateKey`; left
        out or empty, the stored ones are kept, unless the type, the S3 endpoint or the SFTP host, port or user
        changes: then they must be given again. Setting one of `password` and `privateKey` drops the other;
        `removeCa` drops the stored S3 CA bundle.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupTargetUpdate'
      responses:
        '202':
          description: The target is saved; the schedule follows shortly.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [backups]
      operationId: deleteBackupTarget
      summary: Remove a backup target and its secrets
      description: The copies already on the target stay there.
      security:
        - session: []
      responses:
        '202':
          description: The target is removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /backups/targets/{name}/test:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [backups]
      operationId: postBackupTargetTest
      summary: Test a saved backup target
      description: Writes a 1 KiB file to the target, reads it back and deletes it. A failure is reported with a fixed reason.
      security:
        - session: []
      responses:
        '200':
          description: The result of the test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupTargetTest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/BackupsUnavailable'
  /restore:
    get:
      tags: [restore]
      operationId: getRestore
      summary: The state of the restore
      description: The setup phase and the latest restore, with its step, its fixed failure reason and its warning.
      security:
        - session: []
      parameters:
        - name: X-Background-Refresh
          in: header
          required: false
          description: 1 marks a read the console makes on its own, which does not keep the session from going idle.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: The state of the restore.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /restore/upload:
    put:
      tags: [restore]
      operationId: putRestoreUpload
      summary: Upload a backup to restore
      description: |
        Streams the body to the data volume as the backup to restore onto this fresh appliance; it replaces the one
        uploaded or fetched before. The request needs `Content-Length`: a backup that does not fit twice into the
        free space is refused with 409 `no_space` before it is read. Only while setup is `restore`.
      security:
        - session: []
      parameters:
        - name: name
          in: query
          required: true
          description: |
            The backup's file name, ending in `.ilmbackup`. It is stored with every character other than a letter, a
            digit, `.`, `_` and `-` replaced by `_`; an inspection finds it by the same name.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: The backup is stored.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /restore/list:
    post:
      tags: [restore]
      operationId: postRestoreList
      summary: List the backups on a target entered for the restore
      description: |
        Lists the backup files on the target in the request, which is not saved; its secrets are used for this
        request only. A target failure is answered with 502 and a fixed reason as its code. Only while setup is
        `restore`.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreTargetRequest'
      responses:
        '200':
          description: The backup files on the target, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreFiles'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/TargetFailed'
        '503':
          $ref: '#/components/responses/BackupsUnavailable'
  /restore/fetch:
    post:
      tags: [restore]
      operationId: postRestoreFetch
      summary: Fetch a backup to restore from a target entered for the restore
      description: |
        Copies the named backup from the target in the request, which is not saved, to the data volume as the backup
        to restore; it replaces the one uploaded or fetched before. A backup that does not fit twice into the free
        space is refused with 409 `no_space`. A target failure is answered with 502 and a fixed reason as its code.
        Only while setup is `restore`.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreFetch'
      responses:
        '204':
          description: The backup is stored.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/TargetFailed'
        '503':
          $ref: '#/components/responses/BackupsUnavailable'
  /restore/inspect:
    post:
      tags: [restore]
      operationId: postRestoreInspect
      summary: Check a backup with the recovery kit
      description: |
        Opens the kit with its passphrase, verifies the whole backup and describes what a restore would change. The
        backup is the uploaded or fetched one (`upload`, while setup is `restore`) or a local backup (`local`, for a
        restore in place once setup is `complete`). Refusals: `wrong_passphrase` and `invalid_kit` with 400;
        `foreign_kit`, `tampered`, `truncated`, `format_too_new` and `version_unavailable` with 409. The backup key
        stays in the manager's memory for this session until the restore starts or another backup is checked. The
        request body is limited to 1 MiB.
      security:
        - session: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RestoreInspect'
      responses:
        '200':
          description: What the restore would change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /restore/start:
    post:
      tags: [restore]
      operationId: postRestoreStart
      summary: Restore the backup checked in this session
      description: |
        Starts the restore of the backup this session checked last and answers before it ends; `GET /restore`
        reports its progress. Needs `confirm` set to true and the `inspection` of that check's summary. A restore in
        place takes a local backup of the running ILM version; a fresh restore an uploaded or fetched one. The whole
        backup is verified again before anything changes. Refusals with 409: `not_inspected`, `superseded` for a
        check that another one replaced since, `not_local`, `version_unavailable`, `operator_downgrade` for a fresh
        restore that would replace the running ILM operator with the release's older one, `busy`, `setup`,
        `upgrade_in_progress`, `backup_running`, `bundle_loading`, and `tampered` or `truncated` for a backup changed
        since its check.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreStart'
      responses:
        '202':
          description: The restore started.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /restore/resume:
    post:
      tags: [restore]
      operationId: postRestoreResume
      summary: Resume a restore with the recovery kit
      description: |
        Continues a restore that waits for its kit after a manager restart, or one that stopped on a failure, at
        its step. The kit's backup key is checked against the whole backup first. Refusals as for inspect, and
        `not_waiting` and `busy` with 409. The request body is limited to 1 MiB.
      security:
        - session: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RestoreResume'
      responses:
        '202':
          description: The restore continues.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /restore/abandon:
    post:
      tags: [restore]
      operationId: postRestoreAbandon
      summary: Give up a restore
      description: |
        Without a body, gives up the restore a fresh appliance waits for and moves its setup to `part2`, the
        wizard's second part. Refused with 409 `not_restoring` unless setup is `restore`, and with 409
        `restore_started` once a restore was started on this appliance, which then has to be installed again to set
        up a new appliance, and with 409 `handover_pending` while the appliance is still taking over the setup
        answers, and with 409 `busy` while another restore operation runs.

        With `{confirm: true}`, abandons a restore that failed: the ILM operator is started again, the holds the
        restore keeps on the add-ons, the ILM settings and the backups are released, and the restore's step becomes
        `abandoned`. The appliance keeps whatever state the restore reached, and the backup file stays. Refused with
        400 when `confirm` is not true, and with 409 `not_failed` unless the restore failed, with 409 `busy` while a
        restore step runs, with 409 `backup_running` while a backup runs, and with 409 `bundle_loading` while an
        update or a bundle load runs, or an update a restart cut off has not ended.
      security:
        - session: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreAbandon'
      responses:
        '204':
          description: The restore is given up or abandoned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /updates:
    get:
      tags: [updates]
      operationId: getUpdates
      summary: The bundles available online and loaded, and the latest load
      security:
        - session: []
      parameters:
        - name: X-Background-Refresh
          in: header
          required: false
          description: 1 marks a read the console makes on its own, which does not keep the session from going idle.
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: The update bundles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Updates'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/UpdatesUnavailable'
  /updates/check:
    post:
      tags: [updates]
      operationId: postUpdatesCheck
      summary: Check the online repository for newer bundles now
      description: |
        Lists the bundles in the online repository that are newer than what runs and verifies each one's signature
        before listing it, at most the ten newest of each kind. A failed check is answered with 200 and
        `lastCheckError`; the bundles found before stay listed unless the repository was read. A check asked for while
        another runs waits for that one and answers with its result.
      security:
        - session: []
      responses:
        '200':
          description: The check ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Updates'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/UpdatesUnavailable'
  /updates/upload:
    put:
      tags: [updates]
      operationId: putUpdatesUpload
      summary: Upload a bundle file and load it
      description: |
        Streams the body, a bundle file (a tar of its OCI layout), to the data volume and loads it in the background:
        `load` in GET /updates shows how the load ends. The request needs `Content-Length`; a bundle that does not fit
        three times into the free space, once for the file and twice for its load, is refused with 409 `no_space`
        before it is read. Refused with 409 `busy` while a backup, a restore, an update or another load runs. A bundle
        that is not signed with the appliance's key, is damaged, is for another kind or architecture, or cannot be
        installed on what runs is refused with a fixed reason, and nothing of it is kept.
      security:
        - session: []
      parameters:
        - name: kind
          in: query
          required: true
          description: The kind of bundle the file must be.
          schema:
            $ref: '#/components/schemas/BundleKind'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '202':
          description: The bundle is stored and being loaded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/UpdatesUnavailable'
  /updates/fetch:
    post:
      tags: [updates]
      operationId: postUpdatesFetch
      summary: Load a bundle from the online repository
      description: |
        Loads the bundle in the background, with the checks of an upload: `load` in GET /updates shows how it ends.
        Refused with 409 `busy` while a backup, a restore, an update or another load runs.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFetch'
      responses:
        '202':
          description: The bundle is being loaded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/UpdatesUnavailable'
  /updates/platform:
    post:
      tags: [updates]
      operationId: postUpdatesPlatform
      summary: Install a platform bundle
      description: |
        Installs the platform bundle `version` for the appliance's architecture in the background, loaded or found
        online: a backup to every target first, then the bundle's images, its ILM operator and the new ILM version.
        `update` in GET /updates shows its progress. The way back is a reinstall and a restore of that backup, which
        loses the data changed since. Needs `confirm` set to true; otherwise it is answered with 400. Refused with 409:
        `update_running`, `backup_running`, `restore_running`, `bundle_loading`, `busy` while another operation is
        being admitted, `upgrade_in_progress` while the ILM operator upgrades the platform, `not_installed` before the
        platform is installed, `last_update_failed` while the last platform update failed past its point of no return
        and can be rolled back, `blocked` when the bundle cannot be installed on what runs,
        `operator_older_than_running` when the bundle's ILM operator is older than the one that runs, and `no_space`
        when the data volume has less than twice the bundle's size free; with 404 `not_found` when the bundle is
        neither loaded nor found online.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformUpdateStart'
      responses:
        '202':
          description: The update is started.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/UpdatesUnavailable'
  /updates/system:
    post:
      tags: [updates]
      operationId: postUpdatesSystem
      summary: Install a system bundle
      description: |
        Installs the loaded system bundle `version` for the appliance's architecture in the background: a backup to
        every target first, then the bundle's images and manager, Talos and Kubernetes. The
        manager restarts and the node reboots once, so the API and the console are gone for about 10 minutes.
        `update` in GET /updates shows its progress. Needs `confirm` set to true; otherwise it is answered with 400.
        Refused with 409: `update_running`, `backup_running`, `restore_running`, `bundle_loading`, `busy` while another
        operation is being admitted, `upgrade_in_progress` while the ILM operator upgrades the platform,
        `last_update_failed` while the last platform update failed past its point of no return and can be rolled back,
        `not_installed` while the platform is not installed, `blocked` when the bundle cannot be installed on what
        runs, `bundle_unavailable` when the bundle's files are no longer on the appliance, `invalid_bundle` when the
        bundle carries no installer, manager or etcd image, `unmirrored_registry` when one of them comes from a
        registry the appliance does not mirror, `kubernetes_older_than_running` when the bundle's Kubernetes is
        older than the one that runs, which is never downgraded, `kubernetes_minor_skip` when it is more than one minor
        version above the one that runs, and `no_space` when the data volume has less than
        twice the bundle's size free; with 404 `not_found` when the bundle is not loaded. A system update that failed
        past its point of no return runs again from the step it failed at, in the manager of its version.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUpdateStart'
      responses:
        '202':
          description: The update is started.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/UpdatesUnavailable'
  /updates/rollback:
    post:
      tags: [updates]
      operationId: postUpdatesRollback
      summary: Roll the last platform update back
      description: |
        Rolls the last platform update back, whether it completed or failed past its point of no return: the platform
        is uninstalled, installed again at the ILM version that ran before and the backup taken before the update is
        restored in place with the recovery kit's backup key. The data changed since that backup is lost. Only an
        update that kept the ILM operator can be rolled back; after one that installed a newer operator, the way back
        is a restore onto a fresh appliance. `update` in GET /updates shows its progress, with the steps of the
        restore that does it; a restore that waits for its kit or failed is resumed with POST /restore/resume. Needs
        `confirm` set to true; otherwise it is answered with 400. A wrong passphrase or an invalid kit is answered
        as for POST /restore/inspect. Refused with 409: `no_pre_update_backup` when the last update is not a platform
        update or the backup taken before it is gone, `no_previous_bundle` when the platform that ran before is not
        at hand, `operator_changed` when the update installed a newer ILM operator, `not_needed` when the update
        failed before it asked for the new ILM version, `external_database` when the platform uses an external database,
        `foreign_kit` when the kit does not open the backup, `backup_broken` when the backup cannot be restored,
        `upgrade_in_progress`, `update_running`, `backup_running`, `restore_running`, `bundle_loading`, `busy` and
        `not_installed` as for POST /updates/platform. The request body is limited to 1 MiB.
      security:
        - session: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RollbackStart'
      responses:
        '202':
          description: The rollback is started.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/UpdatesUnavailable'
  /updates/notes/{kind}/{version}:
    get:
      tags: [updates]
      operationId: getUpdateNotes
      summary: The release notes of a bundle available or loaded
      description: Markdown, to be shown as text.
      security:
        - session: []
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/BundleKind'
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The release notes.
          content:
            text/markdown:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/UpdatesUnavailable'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: appliance_session
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequestWithServerTime:
      description: The request is invalid or the code was rejected; the appliance time makes clock skew visible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWithServerTime'
    Unauthorized:
      description: There is no valid session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The request lacks the session's CSRF token in `X-CSRF-Token`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Locked:
      description: The credentials were rejected; `retryAfter` is set while further attempts are locked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWithRetry'
    SignInFailed:
      description: >-
        The sign-in failed, with code `invalid_credentials` whichever of user, password or TOTP code was wrong, or
        the request is malformed; the appliance time makes clock skew visible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SignInError'
    SignInLocked:
      description: Too many failed sign-ins; sign-in is locked for `retryAfter` seconds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LockedError'
    NotFound:
      description: The resource does not exist yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: The resource was handed out once and is not available any more.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state, for example setup is in progress in another browser.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RecoveryKitFile:
      description: The recovery kit, an age file encrypted with the passphrase; the appliance does not keep it.
      headers:
        Content-Disposition:
          schema:
            type: string
        X-Recovery-Kit-Issuance:
          description: The issuance of this kit, to confirm it with.
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    ServiceUnavailable:
      description: The node's Talos API cannot be reached at the moment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpdatesUnavailable:
      description: The manager runs without update bundles.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BackupsUnavailable:
      description: The manager runs without backups.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TargetFailed:
      description: The target failed; the code is a fixed reason, never the target's error text.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    BundleKind:
      type: string
      enum: [system, platform]
    UpdateFetch:
      type: object
      required: [kind, version]
      properties:
        kind:
          $ref: '#/components/schemas/BundleKind'
        version:
          type: string
          description: The version, X.Y.Z; the bundle for the appliance's architecture is loaded.
    Updates:
      type: object
      required: [available, loaded, externalDatabase]
      properties:
        lastCheck:
          type: string
          format: date-time
          description: When the online repository was last checked.
        lastCheckError:
          type: string
          enum: [badSignature, unreachable, timeout, failed]
          description: Why the last check failed; absent when it succeeded.
        available:
          type: array
          description: The bundles online that are newer than what runs.
          items:
            $ref: '#/components/schemas/UpdateBundle'
        loaded:
          type: array
          description: The bundles in the appliance's registry and on its data volume.
          items:
            $ref: '#/components/schemas/UpdateBundle'
        load:
          $ref: '#/components/schemas/BundleLoad'
        update:
          $ref: '#/components/schemas/UpdateProgress'
        rollback:
          $ref: '#/components/schemas/RollbackOffer'
        operator:
          type: string
          description: >-
            The ILM operator version that runs. A platform bundle with a newer one cannot be rolled back; the way back
            from it is a restore onto a fresh appliance.
        externalDatabase:
          type: boolean
          description: >-
            Whether the platform uses an external database. A platform update then cannot be rolled back; the way back
            is a restore onto a fresh appliance.
    RollbackOffer:
      type: object
      description: Whether the last platform update can be rolled back now; absent where updates cannot be installed.
      required: [available]
      properties:
        available:
          type: boolean
        reason:
          type: string
          description: >-
            Why it cannot, a fixed reason: `noPreUpdateBackup`, `noPreviousBundle`, `operatorChanged`, `notNeeded`,
            `externalDatabase`, `upgradeInProgress`, `updateRunning`, `restoreRunning` or `failed`; absent when it
            can.
    RollbackStart:
      type: object
      required: [kit, passphrase, confirm]
      properties:
        kit:
          type: string
          format: binary
        passphrase:
          type: string
          format: password
          writeOnly: true
        confirm:
          type: boolean
          description: Must be true; the data changed since the backup taken before the update is lost.
    PlatformUpdateStart:
      type: object
      required: [version, confirm]
      properties:
        version:
          type: string
          description: The version of the platform bundle, X.Y.Z.
        confirm:
          type: boolean
          description: Must be true; the way back from the update is a reinstall and a restore of the backup taken first.
    SystemUpdateStart:
      type: object
      required: [version, confirm]
      properties:
        version:
          type: string
          description: The version of the system bundle, X.Y.Z.
        confirm:
          type: boolean
          description: Must be true; the manager restarts and the node reboots, which takes the appliance down for about 10 minutes.
    UpdateProgress:
      type: object
      description: The latest update, while it runs and once it ended.
      required: [kind, from, to, startedAt, pointOfNoReturn]
      properties:
        kind:
          type: string
          enum: [platform, system, rollback]
        from:
          type: string
          description: The version before the update.
        to:
          type: string
          description: The version being installed.
        step:
          type: string
          description: >-
            The step the update is at: `backup`, `images`, `operator`, `version`, `wait` for a platform update;
            `backup`, `images`, `manager`, `talos`, `health`, `kubernetes`, `addons` for a system update, which
            ends at `rolledBack` when it undid Talos; and `done` once it completed. A rollback is at the step of the restore that does it, as `step` in GET /restore.
        message:
          type: string
          description: >-
            Why the update failed at its step, a fixed reason; absent while it runs and once it completed. A failed
            rollback has the restore's `message`.
        backup:
          type: string
          description: The backup taken before the update.
        startedAt:
          type: string
          format: date-time
        pointOfNoReturn:
          type: boolean
          description: >-
            Set once the update has asked for the new ILM version, or the health check of a system update passed;
            from then on only a rollback, or a restore onto a fresh appliance, undoes it.
    UpdateBundle:
      type: object
      required: [kind, version, arch, sizeBytes, notes]
      properties:
        kind:
          $ref: '#/components/schemas/BundleKind'
        version:
          type: string
        arch:
          type: string
        ilm:
          type: string
          description: The ILM version of a platform bundle.
        operator:
          type: string
          description: The ILM operator version of a platform bundle.
        minAppliance:
          type: string
          description: The oldest appliance version a platform bundle installs on.
        operatorRange:
          type: string
          description: The ILM operator versions a system bundle works with.
        sizeBytes:
          type: integer
          format: int64
          description: The size of the bundle's images.
        loadedAt:
          type: string
          format: date-time
        blocked:
          type: string
          enum: [olderThanRunning, operatorOutOfRange, needsAppliance, wrongArch, sameVersion, invalidMetadata]
          description: Why the bundle cannot be installed now; absent when it can.
        needs:
          type: string
          description: The appliance version that must be installed first.
        notes:
          type: string
          description: The path of the bundle's release notes in this API.
    BundleLoad:
      type: object
      required: [state, kind, startedAt]
      properties:
        state:
          type: string
          enum: [running, loaded, refused, failed]
        kind:
          $ref: '#/components/schemas/BundleKind'
        version:
          type: string
          description: The version, once known.
        reason:
          type: string
          description: >-
            Why a load was refused or failed, a fixed reason: `unsigned`, `badSignature`, `truncated`, `damaged`,
            `formatTooNew`, `invalidBundle`, `wrongKind`, `wrongVersion`, `wrongArch`, `unmirroredRegistry`, `noSpace`,
            `busy`, `notFound`, `unreachable`, `timeout`, `failed`, or a reason of `blocked`.
        startedAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: A machine-readable error code.
        message:
          type: string
        field:
          type: string
          description: The request field that failed validation.
    ErrorWithRetry:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            retryAfter:
              type: integer
              minimum: 0
              description: Seconds until the next attempt is accepted.
    ErrorWithServerTime:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            serverTime:
              type: string
              format: date-time
              description: The appliance time.
    SignInError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [serverTime]
          properties:
            serverTime:
              type: string
              format: date-time
              description: The appliance time.
    LockedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [retryAfter]
          properties:
            retryAfter:
              type: integer
              minimum: 0
              description: Seconds until the next attempt is accepted.
    Readiness:
      type: object
      required: [signIn]
      properties:
        signIn:
          type: boolean
          description: True once the administrator is imported and the console accepts a sign-in.
    CsrfToken:
      type: object
      required: [csrfToken]
      properties:
        csrfToken:
          type: string
    SetupCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
    SetupStep:
      type: string
      enum: [code, mode, admin, totp, node, apply, applying]
    SetupState:
      type: object
      required: [step]
      properties:
        step:
          $ref: '#/components/schemas/SetupStep'
        csrfToken:
          type: string
          description: Present with a valid setup session.
    SetupMode:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [new, restore]
          description: >-
            `new` sets up an appliance with wizard part 2; `restore` hands over to the restore of a backup, which
            keeps wizard part 2 closed.
    AdminAccount:
      type: object
      required: [user, password]
      properties:
        user:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
    TotpEnrolment:
      type: object
      required: [seed, otpauthUrl]
      properties:
        seed:
          type: string
        otpauthUrl:
          type: string
    TotpCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
    Proxy:
      type: object
      properties:
        http:
          type: string
          description: The HTTP proxy URL.
        https:
          type: string
          description: The HTTPS proxy URL.
        noProxy:
          type: string
          description: Comma-separated hosts and networks that bypass the proxy.
    NodeSettings:
      type: object
      required: [hostName, address, gateway, dns, ntp]
      properties:
        hostName:
          type: string
        address:
          type: string
          description: The static node address in CIDR notation; empty keeps the address DHCP delivers.
        gateway:
          type: string
          description: The default gateway of the static address; empty with DHCP.
        dns:
          type: array
          items:
            type: string
        ntp:
          type: array
          items:
            type: string
        proxy:
          $ref: '#/components/schemas/Proxy'
    DhcpSettings:
      type: object
      properties:
        hostName:
          type: string
        address:
          type: string
          description: The node address in CIDR notation.
        gateway:
          type: string
        dns:
          type: array
          items:
            type: string
        ntp:
          type: array
          items:
            type: string
    Session:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          type: string
        csrfToken:
          type: string
    SignIn:
      type: object
      required: [user, password, totp]
      properties:
        user:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
        totp:
          type: string
    Condition:
      type: object
      required: [type, status]
      properties:
        type:
          type: string
        status:
          type: string
          enum: ['True', 'False', 'Unknown']
        reason:
          type: string
        message:
          type: string
        lastTransitionTime:
          type: string
          format: date-time
    Versions:
      type: object
      properties:
        appliance:
          type: string
        talos:
          type: string
        kubernetes:
          type: string
        operator:
          type: string
        ilm:
          type: string
    Status:
      type: object
      required: [setup, conditions, versions, rebootRequired]
      properties:
        setup:
          type: string
          enum: [part1, part2, complete, restore]
        addonStep:
          type: string
          description: The add-on being installed while AddonsReady is not true yet.
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        versions:
          $ref: '#/components/schemas/Versions'
        nodeAddress:
          type: string
          description: The address the node is reached at.
        rebootRequired:
          type: boolean
          description: A change takes effect only after the node restarts.
        certificate:
          $ref: '#/components/schemas/StatusCertificate'
        dataVolume:
          $ref: '#/components/schemas/DataVolume'
        recoveryKit:
          $ref: '#/components/schemas/RecoveryKit'
        backup:
          $ref: '#/components/schemas/StatusBackup'
        adminCredentialRenewed:
          type: boolean
          description: >-
            The ILM administrator's certificate was renewed and ILM's administrator holds the new one, which has not
            been downloaded yet; the credential downloaded before no longer signs in.
    DataVolume:
      type: object
      description: The size and free space of the data volume; absent while the manager cannot read it.
      required: [sizeBytes, freeBytes, lowSpace]
      properties:
        sizeBytes:
          type: integer
          format: int64
        freeBytes:
          type: integer
          format: int64
          description: The free space, rounded down to steps of 1% of the size.
        lowSpace:
          type: boolean
          description: Less than a fifth of the volume is free, judged on the exact free space.
    StatusCertificate:
      type: object
      description: The certificate the console and ILM serve; absent while none is issued or installed.
      required: [notAfter]
      properties:
        notAfter:
          type: string
          format: date-time
    MailSecurity:
      type: string
      enum: [none, starttls, tls]
    Mail:
      type: object
      required: [host, port, security, from]
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        security:
          $ref: '#/components/schemas/MailSecurity'
        from:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
    MailSettings:
      type: object
      required: [host, port, security, from, passwordSet]
      properties:
        host:
          type: string
        port:
          type: integer
        security:
          $ref: '#/components/schemas/MailSecurity'
        from:
          type: string
        username:
          type: string
        passwordSet:
          type: boolean
    PlatformSettings:
      type: object
      required: [hostName, components]
      properties:
        hostName:
          type: string
        components:
          type: array
          items:
            type: string
        mail:
          $ref: '#/components/schemas/Mail'
        dependencies:
          $ref: '#/components/schemas/DependenciesUpdate'
        utils:
          type: boolean
          description: Install the utils service; left out keeps the current choice.
    Registry:
      type: object
      required: [host, credentialsSet]
      properties:
        host:
          type: string
        credentialsSet:
          type: boolean
    ApplianceSettings:
      type: object
      required: [cluster, dns, ntp, tlsSource, trustSet, registries]
      properties:
        cluster:
          $ref: '#/components/schemas/ClusterSettings'
        dns:
          type: array
          items:
            type: string
        ntp:
          type: array
          items:
            type: string
        proxy:
          $ref: '#/components/schemas/Proxy'
        tlsSource:
          type: string
          enum: [builtin, secret]
        trustSet:
          type: boolean
          description: Whether additional trusted CA certificates are set.
        registries:
          type: array
          items:
            $ref: '#/components/schemas/Registry'
        mail:
          $ref: '#/components/schemas/MailSettings'
        platform:
          type: object
          required: [components]
          properties:
            ilmVersion:
              type: string
            hostName:
              type: string
            components:
              type: array
              items:
                type: string
    ClusterSettings:
      type: object
      required: [nodes]
      properties:
        address:
          $ref: '#/components/schemas/ClusterAddress'
        nodes:
          type: array
          description: The nodes of the cluster, the first node first.
          items:
            $ref: '#/components/schemas/ClusterNode'
    ClusterAddress:
      type: object
      description: The address the cluster is reached at; neither set is the address of the first node.
      properties:
        virtual:
          type: string
          description: A virtual IPv4 address the nodes share.
        external:
          type: string
          description: A DNS name that resolves to the nodes.
    ClusterNode:
      type: object
      required: [hostName, tags, maintenance]
      properties:
        hostName:
          type: string
        address:
          type: string
          description: The node address in CIDR notation; unset with DHCP.
        gateway:
          type: string
        role:
          type: string
          enum: [voting, worker]
        tags:
          type: array
          items:
            type: string
        maintenance:
          type: boolean
    CatalogueItem:
      type: object
      required: [name, title, private]
      properties:
        name:
          type: string
        title:
          type: string
        description:
          type: string
        private:
          type: boolean
          description: Whether the component's images come from a registry that needs credentials.
    Catalogue:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogueItem'
    AuditEntry:
      type: object
      required: [time, user, action, result, paths]
      properties:
        time:
          type: string
          format: date-time
        user:
          type: string
          description: The signed-in user, or the existing account a sign-in attempt named; `system:manager` for what the manager did on its own, an expired kubeconfig revoked or a backup it started; empty otherwise.
        action:
          type: string
          enum: [sign-in, sign-out, wizard-platform, admin-credential, admin-password-shown, admin-password-reset,
            node-settings, reboot, shutdown, certificate-upload, certificate-csr, certificate-signed, certificate-builtin, certificate-acme, trust-add, trust-remove, registry-set,
            registry-remove, platform-settings, dependency-test, mail-settings, mail-remove, mail-test, kubeconfig-issue,
            kubeconfig-revoke, talosconfig-issue, recovery-kit-issue, recovery-kit-reissue, recovery-kit-replace,
            recovery-kit-confirm, backup, backup-download, backup-target-set, backup-target-remove,
            backup-target-test, backup-host-key-scan, restore-upload, restore-fetch, restore-inspect, restore-start,
            restore-resume, restore-abandon, restore, update-check, update-upload, update-fetch, bundle-loaded,
            platform-update-start, platform-update, platform-rollback-start, system-update-start,
            system-update]
        result:
          type: string
          enum: [success, failure, denied]
          description: >-
            `denied` when the request had a missing or wrong CSRF token or its session expired mid-request, `failure`
            when it was refused for another reason.
        paths:
          type: array
          description: The Appliance fields the request changed, as JSON paths; never their values.
          items:
            type: string
        details:
          type: object
          description: >-
            What an issued or revoked credential grants: its `role`, `name` and `expires`, and for a recovery kit the
            `recipient` public key and the talosconfig's `expires`, and for the ACME certificate its `provider` and
            `solver`; never a token, certificate, key or passphrase.
          additionalProperties:
            type: string
    CertificateInfo:
      type: object
      required: [source, csrPending]
      properties:
        source:
          type: string
          enum: [builtin, secret, acme]
          description: >-
            `builtin` for the certificate the built-in CA issues, `secret` for an uploaded one, `acme` for one an ACME
            server issues.
        csrPending:
          type: boolean
          description: A signing request waits for its certificate.
        certificate:
          $ref: '#/components/schemas/CertificateDetails'
        acme:
          $ref: '#/components/schemas/AcmeInfo'
    AcmeInfo:
      type: object
      description: The ACME settings, present when the source is `acme`. Never a secret value.
      required: [solver]
      properties:
        directoryUrl:
          type: string
        email:
          type: string
        eabKeyId:
          type: string
        eabHmacSet:
          type: boolean
          description: The HMAC key of the external account binding is stored.
        caBundle:
          type: string
          description: The stored PEM CA bundle for the ACME server.
        solver:
          $ref: '#/components/schemas/AcmeSolverInfo'
        ilm:
          $ref: '#/components/schemas/AcmeIlm'
        lastError:
          type: string
          description: Why the certificate is not issued yet, while it is not.
    AcmeSolverInfo:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [http01, dns01]
        dns01:
          $ref: '#/components/schemas/AcmeDns01Info'
    AcmeDns01Info:
      type: object
      required: [provider, config, credentialKeys]
      properties:
        provider:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
        credentialKeys:
          type: array
          description: The credentials that are stored, by name.
          items:
            type: string
    AcmeIlm:
      type: object
      required: [raProfileUuid, vaultUuid, vaultProfileUuid]
      properties:
        raProfileUuid:
          type: string
        vaultUuid:
          type: string
        vaultProfileUuid:
          type: string
    AcmeIlmOptions:
      type: object
      required: [raProfiles, vaultProfiles]
      properties:
        raProfiles:
          type: array
          items:
            $ref: '#/components/schemas/AcmeIlmRaProfile'
        vaultProfiles:
          type: array
          items:
            $ref: '#/components/schemas/AcmeIlmVaultProfile'
    AcmeIlmRaProfile:
      type: object
      required: [uuid, name]
      properties:
        uuid:
          type: string
        name:
          type: string
    AcmeIlmVaultProfile:
      type: object
      required: [uuid, name, vaultUuid]
      properties:
        uuid:
          type: string
        name:
          type: string
        vaultUuid:
          type: string
    AcmeSolverSettings:
      type: object
      description: How the host names are proven; `http01` when omitted. Ignored with `ilm`.
      required: [type]
      properties:
        type:
          type: string
          enum: [http01, dns01]
        dns01:
          $ref: '#/components/schemas/AcmeDns01Settings'
    AcmeDns01Settings:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          description: One of rfc2136, cloudflare, route53, azuredns, clouddns, digitalocean, acmedns, akamai.
        config:
          type: object
          description: The provider's settings that are not secret.
          additionalProperties:
            type: string
        credentials:
          type: object
          description: The provider's secret settings.
          writeOnly: true
          additionalProperties:
            type: string
    AcmeSettings:
      type: object
      description: >-
        Either `directoryUrl` for an ACME server of your own or `ilm` for the ACME profile of this appliance's ILM,
        not both.
      properties:
        directoryUrl:
          type: string
          description: The https directory of the ACME server.
        email:
          type: string
        eabKeyId:
          type: string
          description: Needs `eabHmac`.
        eabHmac:
          type: string
          writeOnly: true
        caBundle:
          type: string
          description: PEM certificates that sign the ACME server's certificate.
        solver:
          $ref: '#/components/schemas/AcmeSolverSettings'
        ilm:
          $ref: '#/components/schemas/AcmeIlm'
    CertificateDetails:
      type: object
      description: The certificate in use; absent until the built-in certificate is issued.
      required: [subject, issuer, dnsNames, ipAddresses, notBefore, notAfter]
      properties:
        subject:
          type: string
        issuer:
          type: string
        dnsNames:
          type: array
          items:
            type: string
        ipAddresses:
          type: array
          items:
            type: string
        notBefore:
          type: string
          format: date-time
        notAfter:
          type: string
          format: date-time
    CertificateUpload:
      type: object
      required: [certificate, key]
      properties:
        certificate:
          type: string
          format: binary
          description: The certificate in PEM, optionally followed by its chain.
        key:
          type: string
          format: binary
          description: The certificate's private key in PEM, unencrypted.
        chain:
          type: string
          format: binary
          description: The intermediate and root certificates in PEM.
    SignedCertificateUpload:
      type: object
      required: [certificate]
      properties:
        certificate:
          type: string
          format: binary
          description: The certificate in PEM, optionally followed by its chain.
        chain:
          type: string
          format: binary
          description: The intermediate and root certificates in PEM.
    AdminPassword:
      type: object
      required: [user, password]
      properties:
        user:
          type: string
          description: The user name of the ILM administrator.
        password:
          type: string
          format: password
          description: The password; the appliance shows it once.
    AdminCredentialRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          description: >-
            The password that encrypts the PKCS#12 file. Like a console password, it has at least 12 characters, is
            not one of the most common passwords and does not contain the user name.
        format:
          type: string
          enum: [compatible, modern]
          default: compatible
          description: >-
            `compatible` encrypts the file with 3DES and a SHA-1 MAC, which macOS Keychain, Windows and Java import;
            `modern` uses AES-256 and a SHA-256 MAC, which they may refuse.
    AuditLog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next:
          type: string
          description: The cursor of the following page; absent when no older entry is left.
    NodeUpdate:
      type: object
      required: [dns, ntp]
      properties:
        hostName:
          type: string
          description: >-
            Optional; the node host name is fixed at setup. A value other than the current host name is answered
            with 400.
        address:
          type: string
          description: Not accepted; the node address is fixed at setup. A request with it is answered with 400.
        gateway:
          type: string
          description: The default gateway of the static address; empty with DHCP.
        dns:
          type: array
          items:
            type: string
        ntp:
          type: array
          items:
            type: string
        proxy:
          $ref: '#/components/schemas/Proxy'
    AccessList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessCredential'
    AccessCredential:
      type: object
      required: [kind, role, issuedBy, issuedAt]
      properties:
        kind:
          type: string
          enum: [kubeconfig, talosconfig]
        name:
          type: string
          description: The name a kubeconfig is revoked by; talosconfigs have none.
        role:
          type: string
        issuedBy:
          type: string
        issuedAt:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
          description: When the credential stops working; absent for a long-lived kubeconfig.
        breakGlass:
          type: boolean
          description: Set on the break-glass kubeconfig of the recovery kit, which only issuing the kit again revokes.
    KubeconfigRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [view, cluster-admin]
        hours:
          type: integer
          minimum: 1
          maximum: 24
          description: How long the token is valid; without it the kubeconfig is long-lived and needs `name`.
        name:
          type: string
          description: Up to 40 lower-case letters, digits and hyphens; required for a long-lived kubeconfig.
    TalosconfigRequest:
      type: object
      required: [role, hours]
      properties:
        role:
          type: string
          enum: ['os:reader', 'os:admin']
        hours:
          type: integer
          minimum: 1
          maximum: 8
    RecoveryKit:
      type: object
      required: [issued, confirmed]
      properties:
        issued:
          type: boolean
          description: >-
            A backup key is stored. When the latest kit was not handed out, the other fields but the recipient are
            absent and the kit can only be replaced.
        confirmed:
          type: boolean
          description: The administrator confirmed that the latest kit is stored safely.
        issuedAt:
          type: string
          format: date-time
        talosconfigNotAfter:
          type: string
          format: date-time
          description: When the kit's talosconfig expires; issue the kit again before then.
        recipient:
          type: string
          description: The public key the backups are encrypted to.
        issuance:
          type: string
          description: >-
            A random identifier of the latest kit, new with every issue, reissue and replace; absent while the latest
            kit was not handed out.
    RecoveryKitConfirm:
      type: object
      required: [issuance]
      properties:
        issuance:
          type: string
          description: The issuance of the kit that was stored, as its download answer named it.
    RecoveryKitRequest:
      type: object
      required: [passphrase]
      properties:
        passphrase:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          description: >-
            The passphrase that encrypts the kit. Like a console password, it has at least 12 characters and is not
            one of the most common passwords.
    RecoveryKitReplace:
      type: object
      required: [passphrase, confirm]
      properties:
        passphrase:
          type: string
          format: password
          writeOnly: true
          minLength: 12
        confirm:
          type: boolean
          description: Must be true; backups made before stay readable only with the lost kit.
    RecoveryKitReissue:
      type: object
      required: [kit, passphrase, newPassphrase]
      properties:
        kit:
          type: string
          format: binary
          description: The current recovery kit.
        passphrase:
          type: string
          format: password
          writeOnly: true
          description: The passphrase of the uploaded kit.
        newPassphrase:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          description: The passphrase of the new kit.
    Confirmation:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true.
    TrustedCertificate:
      type: object
      required: [subject, issuer, notAfter, sha256]
      properties:
        subject:
          type: string
        issuer:
          type: string
        notAfter:
          type: string
          format: date-time
        sha256:
          type: string
          description: The SHA-256 fingerprint of the certificate's DER in lowercase hex, which identifies it.
        new:
          type: boolean
          description: In a preview, the upload adds the certificate.
    TrustedCertificateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrustedCertificate'
    TrustUpload:
      type: object
      required: [pem]
      properties:
        pem:
          type: string
          description: One or more CA certificates in PEM.
    RegistryCredentials:
      type: object
      required: [host, username, passwordSet]
      properties:
        host:
          type: string
        username:
          type: string
          description: The user name of the credentials; empty for a registry without credentials.
        passwordSet:
          type: boolean
    RegistryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RegistryCredentials'
    RegistryCredentialsUpdate:
      type: object
      required: [username]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          writeOnly: true
          description: Required unless the registry has a password for the same user name, which is then kept.
    PlatformComponent:
      type: object
      required: [name, title, private, chosen, needsCredentials, needsMail, registered]
      properties:
        name:
          type: string
        title:
          type: string
        registered:
          type: boolean
          description: |
            Whether the component is registered in ILM once it runs: ILM's operator registers it, or the appliance
            does for a component that speaks only interface v1, at `url`.
        url:
          type: string
          description: The in-cluster address the appliance registers a component that speaks only interface v1 with.
        private:
          type: boolean
          description: Whether the component's image comes from a registry that needs credentials.
        chosen:
          type: boolean
        needsCredentials:
          type: boolean
          description: A private component whose registry has no credentials yet.
        needsMail:
          type: boolean
          description: A component that sends mail while no mail server is set.
        state:
          type: string
          enum: [ready, waiting, failed]
          description: Set for a chosen component the manager reports on.
        problem:
          type: string
          description: Why a failed component failed, in plain words.
    PlatformState:
      type: object
      required: [ilmVersion, hostName, components, dependencies, utils, cbom, setupComplete]
      properties:
        ilmVersion:
          type: string
        hostName:
          type: string
        components:
          type: array
          items:
            $ref: '#/components/schemas/PlatformComponent'
        dependencies:
          $ref: '#/components/schemas/Dependencies'
        utils:
          type: boolean
        cbom:
          $ref: '#/components/schemas/CBOMRepository'
        setupComplete:
          type: boolean
          description: Once setup is complete a dependency no longer switches between managed and external.
    PlatformUpdate:
      type: object
      required: [hostName, components]
      properties:
        hostName:
          type: string
        components:
          type: array
          items:
            type: string
        ilmVersion:
          type: string
          description: Optional; must be the installed version, which cannot be changed.
        dependencies:
          $ref: '#/components/schemas/DependenciesUpdate'
        utils:
          type: boolean
          description: Install the utils service; left out keeps the current choice.
        cbom:
          $ref: '#/components/schemas/CBOMRepository'
    CBOMStorage:
      type: string
      enum: [appliance, s3]
      x-enum-varnames: [CBOMStorageAppliance, CBOMStorageS3]
    CBOMRepository:
      type: object
      required: [enabled, storage]
      description: >-
        The CBOM repository ILM keeps CBOMs in, reachable only by ILM. Turned off, the CBOMs stored on the appliance
        are kept. Left out of an update, the current settings are kept.
      properties:
        enabled:
          type: boolean
        storage:
          $ref: '#/components/schemas/CBOMStorage'
        s3:
          $ref: '#/components/schemas/CBOMS3'
    CBOMS3:
      type: object
      required: [endpoint, bucket]
      description: The external S3 bucket of `storage` s3; keys left out keep the stored ones for the same endpoint.
      properties:
        endpoint:
          type: string
          description: The https or http URL of the S3 service, without a path; without a scheme it is https.
        bucket:
          type: string
        region:
          type: string
          description: Defaults to us-east-1.
        accessKey:
          type: string
          format: password
          writeOnly: true
        secretKey:
          type: string
          format: password
          writeOnly: true
        ca:
          type: string
          writeOnly: true
          description: The PEM CA bundle that signs the endpoint's certificate, when it is not publicly trusted.
        removeCa:
          type: boolean
          writeOnly: true
          description: Remove the stored CA bundle.
        accessKeySet:
          type: boolean
          readOnly: true
        secretKeySet:
          type: boolean
          readOnly: true
        caSet:
          type: boolean
          readOnly: true
    DependencyMode:
      type: string
      enum: [managed, external]
      x-enum-varnames: [ModeManaged, ModeExternal]
    DatabaseDependency:
      type: object
      required: [mode]
      description: The database; managed, or an external PostgreSQL database with `host`, `name` and `username`.
      properties:
        mode:
          $ref: '#/components/schemas/DependencyMode'
        host:
          type: string
          description: A host name or an IPv4 address.
        port:
          type: integer
          description: Defaults to 5432.
        name:
          type: string
          description: The database; letters, digits and `_ $ . -`, at most 63.
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
          description: Required unless the stored one was given for the same host, port, database and user name.
        passwordSet:
          type: boolean
          readOnly: true
        tlsMode:
          type: string
          enum: [disable, require, verify-full]
          x-enum-varnames: [TLSDisable, TLSRequire, TLSVerifyFull]
          description: >-
            The sslmode of the connection; left out, the drivers' default uses TLS when the server offers it without
            verifying the server. ILM's core and scheduler verify the server with verify-full; its auth service and
            Keycloak encrypt the connection when the server offers TLS but never verify the server's certificate.
        ca:
          type: string
          writeOnly: true
          description: >-
            The PEM CA bundle that signs the server's certificate; verify-full needs it, otherwise the answer is 400
            with field `ca`. Left out, the stored one is kept.
        caSet:
          type: boolean
          readOnly: true
    MessagingDependency:
      type: object
      required: [mode]
      description: The message broker; managed, or an external RabbitMQ broker with `host` and `username`.
      properties:
        mode:
          $ref: '#/components/schemas/DependencyMode'
        host:
          type: string
          description: A host name or an IPv4 address.
        port:
          type: integer
          description: Defaults to 5672, or 5671 with `tls`.
        virtualHost:
          type: string
          description: Defaults to /.
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
          description: Required unless the stored one was given for the same host, port, virtual host and user name.
        passwordSet:
          type: boolean
          readOnly: true
        tls:
          type: boolean
          description: Connect with AMQPS to `port`, verifying the broker against `ca`.
        ca:
          type: string
          writeOnly: true
          description: >-
            The PEM CA bundle that signs the broker's certificate; `tls` needs it, otherwise the answer is 400 with
            field `ca`. Left out, the stored one is kept.
        caSet:
          type: boolean
          readOnly: true
    IdentityDependency:
      type: object
      required: [mode]
      description: The identity provider; the managed Keycloak, or an external OIDC provider with `issuer` and `clientId`.
      properties:
        mode:
          $ref: '#/components/schemas/DependencyMode'
        issuer:
          type: string
          description: The issuer URL, starting with https://.
        clientId:
          type: string
        scopes:
          type: array
          items:
            type: string
        audiences:
          type: array
          maxItems: 16
          items:
            type: string
          description: >-
            The audiences ILM accepts in the provider's tokens, at most 16 without spaces. Without any, ILM accepts
            every token the issuer signs, whatever client it was issued for.
        clientSecret:
          type: string
          format: password
          writeOnly: true
          description: Required unless the stored one was given for the same issuer and client ID.
        clientSecretSet:
          type: boolean
          readOnly: true
    Dependencies:
      type: object
      required: [database, messaging, identity]
      properties:
        database:
          $ref: '#/components/schemas/DatabaseDependency'
        messaging:
          $ref: '#/components/schemas/MessagingDependency'
        identity:
          $ref: '#/components/schemas/IdentityDependency'
    DependenciesUpdate:
      type: object
      description: The dependencies to choose; one left out keeps its current choice.
      properties:
        database:
          $ref: '#/components/schemas/DatabaseDependency'
        messaging:
          $ref: '#/components/schemas/MessagingDependency'
        identity:
          $ref: '#/components/schemas/IdentityDependency'
    DependencyTest:
      type: object
      required: [kind, settings]
      properties:
        kind:
          type: string
          enum: [database, messaging, identity]
          x-enum-varnames: [KindDatabase, KindMessaging, KindIdentity]
        settings:
          description: The external settings of the dependency `kind` names.
          oneOf:
            - $ref: '#/components/schemas/DatabaseDependency'
            - $ref: '#/components/schemas/MessagingDependency'
            - $ref: '#/components/schemas/IdentityDependency'
    DependencyTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        reason:
          type: string
          enum: [unreachable, timeout, authFailed, notFound, untrusted, invalid, failed]
          x-enum-varnames: [DependencyUnreachable, DependencyTimeout, DependencyAuthFailed, DependencyNotFound, DependencyUntrusted, DependencyInvalid, DependencyFailed]
          description: >-
            A fixed reason; the error text of the dependency is never passed on. `notFound` is an issuer without a
            discovery document or a virtual host the broker refuses. For a database under verify-full, `authFailed`
            may also be a certificate that does not verify, which PostgreSQL's client reports alike: the test opens
            one session in the chosen mode and never sends the credentials with less verification. `untrusted` is a server certificate
            the CA does not sign or that does not name the host; `invalid` is an answer that is not the dependency's
            protocol or a discovery document that does not match the issuer.
    MailState:
      type: object
      properties:
        mail:
          $ref: '#/components/schemas/MailSettings'
    MailTest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          description: The address the test mail is sent to.
    MailTestFailure:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [stage]
          properties:
            stage:
              type: string
              enum: [connect, tls, auth, send]
              x-enum-varnames: [StageConnect, StageTLS, StageAuth, StageSend]
              description: The stage that failed.
    BackupRecord:
      type: object
      required: [name, time, sizeBytes, database]
      properties:
        name:
          type: string
        time:
          type: string
          format: date-time
        sizeBytes:
          type: integer
          format: int64
        database:
          type: string
          enum: [included, notIncluded]
          description: >-
            `notIncluded` when the database did not answer, as an external database may not; its owner must back it
            up.
    BackupTargetReason:
      type: string
      enum: [unreachable, authFailed, hostKeyMismatch, notFound, noSpace, timeout, failed]
      description: A fixed reason; the error text of the target is never passed on.
    BackupTargetHealth:
      type: object
      required: [name, warning]
      properties:
        name:
          type: string
        lastSuccess:
          type: string
          format: date-time
        lastAttempt:
          type: string
          format: date-time
        lastError:
          $ref: '#/components/schemas/BackupTargetReason'
        warning:
          type: boolean
          description: >-
            Twice the target's interval passed since its last successful copy, or no copy succeeded although one was
            attempted; judged at each read.
    S3Settings:
      type: object
      required: [endpoint, bucket]
      properties:
        endpoint:
          type: string
          description: The https or http URL of the S3 service, without a path; without a scheme it is https.
        bucket:
          type: string
        prefix:
          type: string
        region:
          type: string
    SFTPSettings:
      type: object
      required: [host, path, user, hostKey]
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 22 when left out.
        path:
          type: string
        user:
          type: string
        hostKey:
          type: string
          description: The SHA256 fingerprint of the accepted host key, as the host key scan returns it.
    NFSSettings:
      type: object
      required: [server, export]
      properties:
        server:
          type: string
        export:
          type: string
        path:
          type: string
        version:
          type: string
          enum: ['3', '4.1', '4.2']
          description: 4.1 when left out.
    BackupSecretsSet:
      type: object
      description: Which secrets of the target are stored; never their values.
      required: [accessKey, secretKey, ca, password, privateKey]
      properties:
        accessKey:
          type: boolean
        secretKey:
          type: boolean
        ca:
          type: boolean
        password:
          type: boolean
        privateKey:
          type: boolean
    BackupTarget:
      type: object
      required: [name, type, schedule, timeZone, retention, secretsSet, health]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [s3, sftp, nfs]
        schedule:
          type: string
        timeZone:
          type: string
        retention:
          type: integer
        s3:
          $ref: '#/components/schemas/S3Settings'
        sftp:
          $ref: '#/components/schemas/SFTPSettings'
        nfs:
          $ref: '#/components/schemas/NFSSettings'
        secretsSet:
          $ref: '#/components/schemas/BackupSecretsSet'
        health:
          $ref: '#/components/schemas/BackupTargetHealth'
    BackupTargetUpdate:
      type: object
      required: [type, timeZone]
      properties:
        type:
          type: string
          enum: [s3, sftp, nfs]
        schedule:
          type: string
          description: A five-field cron expression; `0 2 * * *` when left out.
        timeZone:
          type: string
          description: The IANA time zone of the schedule, such as Europe/Prague.
        retention:
          type: integer
          minimum: 1
          maximum: 365
          description: The backups kept on the target; 14 when left out.
        s3:
          allOf:
            - $ref: '#/components/schemas/S3Settings'
            - type: object
              properties:
                accessKey:
                  type: string
                  format: password
                  writeOnly: true
                secretKey:
                  type: string
                  format: password
                  writeOnly: true
                ca:
                  type: string
                  writeOnly: true
                  description: The PEM CA bundle that signs the endpoint's certificate, when it is not publicly trusted.
                removeCa:
                  type: boolean
                  description: Removes the stored CA bundle; the endpoint must then be publicly trusted.
        sftp:
          allOf:
            - $ref: '#/components/schemas/SFTPSettings'
            - type: object
              properties:
                password:
                  type: string
                  format: password
                  writeOnly: true
                privateKey:
                  type: string
                  format: password
                  writeOnly: true
                  description: An OpenSSH or PEM private key without a passphrase.
        nfs:
          $ref: '#/components/schemas/NFSSettings'
    Backups:
      type: object
      required: [running, local, targets]
      properties:
        running:
          type: boolean
        last:
          $ref: '#/components/schemas/BackupRecord'
        local:
          type: array
          description: The backups on the data volume, newest first.
          items:
            $ref: '#/components/schemas/BackupRecord'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/BackupTarget'
        healthy:
          $ref: '#/components/schemas/Condition'
        lastRestoreTest:
          type: string
          format: date-time
          description: When a restore test last succeeded.
    StatusBackup:
      type: object
      required: [running, targets]
      properties:
        running:
          type: boolean
        last:
          $ref: '#/components/schemas/BackupRecord'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/BackupTargetHealth'
        lastRestoreTest:
          type: string
          format: date-time
          description: When a restore test last succeeded; absent when none did.
    BackupTargetTest:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        reason:
          $ref: '#/components/schemas/BackupTargetReason'
    HostKeyRequest:
      type: object
      required: [host]
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: 22 when left out.
    HostKey:
      type: object
      required: [fingerprint]
      properties:
        fingerprint:
          type: string
          description: The SHA256 fingerprint of the host key, as ssh-keygen -l prints it.
    RestoreState:
      type: object
      required: [setup]
      properties:
        setup:
          type: string
          description: The setup phase, as in the status; `restore` while the appliance waits for a backup to restore.
        restore:
          $ref: '#/components/schemas/RestoreProgress'
    RestoreProgress:
      type: object
      required: [backup, inPlace, step]
      properties:
        backup:
          type: string
          description: The file name of the backup.
        inPlace:
          type: boolean
        step:
          type: string
          enum: [secrets, appliance, platform, stop, ilmSecrets, database, cbom, start, keycloak, certificate, uninstall,
            reinstall, done, waitingForKit, abandoned]
          x-enum-varnames: [StepSecrets, StepAppliance, StepPlatform, StepStop, StepILMSecrets, StepDatabase, StepCBOM, StepStart,
            StepKeycloak, StepCertificate, StepUninstall, StepReinstall, StepDone, StepWaitingForKit, StepAbandoned]
          description: |
            The step that runs, or the one a failed restore stopped at; `waitingForKit` after a manager restart and
            `abandoned` once a failed restore was given up. A rollback of a platform update first stops ILM,
            uninstalls the platform and installs it again (`uninstall`, `reinstall`), then restores the backup.
        pausedStep:
          type: string
          description: The step a restore waiting for its kit resumes at.
        message:
          type: string
          enum: [failed, timeout]
          description: The fixed reason a restore failed at its step; absent unless it failed.
        warning:
          type: string
          description: What a completed restore left for the administrator.
        ilmHostName:
          type: string
          description: The ILM host name the restore sets; absent when it keeps the backup's.
        startedAt:
          type: string
          format: date-time
        rollback:
          type: string
          enum: [reinstalling, restoring]
          x-enum-varnames: [RollbackReinstalling, RollbackRestoring]
          description: |
            Set on a restore that rolls a platform update back: `reinstalling` until the platform runs the previous
            ILM version again, from `stop` through `reinstall`, then `restoring` while the backup is restored into it,
            from a second `stop` on.
    RestoreTargetRequest:
      type: object
      required: [target]
      properties:
        target:
          $ref: '#/components/schemas/BackupTargetUpdate'
    RestoreFetch:
      type: object
      required: [target, name]
      properties:
        target:
          $ref: '#/components/schemas/BackupTargetUpdate'
        name:
          type: string
          description: |
            The backup's file name in the target's listing, ending in `.ilmbackup`; it is stored as an upload is.
    RestoreFile:
      type: object
      required: [name, sizeBytes, modified]
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
        modified:
          type: string
          format: date-time
    RestoreFiles:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/RestoreFile'
    RestoreInspect:
      type: object
      required: [source, name, kit, passphrase]
      properties:
        source:
          type: string
          enum: [upload, local]
          x-enum-varnames: [SourceUpload, SourceLocal]
          description: The uploaded or fetched backup, or a local backup for a restore in place.
        name:
          type: string
          description: The backup's file name.
        kit:
          type: string
          format: binary
          description: The recovery kit whose backup key the backup is encrypted to.
        passphrase:
          type: string
          format: password
          writeOnly: true
    RestoreResume:
      type: object
      required: [kit, passphrase]
      properties:
        kit:
          type: string
          format: binary
        passphrase:
          type: string
          format: password
          writeOnly: true
    RestoreAbandon:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true; the appliance keeps whatever state the failed restore reached.
    RestoreSummary:
      type: object
      required: [inspection, backup, inPlace, time, hostName, ilmHostName, nodeHostName, ilm, operator, appliance,
        database, databaseIncluded, accounts, clashes, components, dependencies]
      properties:
        inspection:
          type: string
          description: Identifies this check of the backup; `POST /restore/start` names it to restore this backup.
        backup:
          type: string
          description: The backup's file name.
        inPlace:
          type: boolean
        time:
          type: string
          format: date-time
          description: When the backup was taken.
        hostName:
          type: string
          description: >-
            The node host name the backup's manifest names; the manifest is not proof of where the backup comes from.
        ilmHostName:
          type: string
          description: The backup's ILM host name, which the restore keeps unless another is given.
        nodeHostName:
          type: string
          description: This node's host name, which the restore keeps.
        ilm:
          type: string
        operator:
          type: string
        appliance:
          type: string
        database:
          type: string
          enum: [managed, external]
          x-enum-varnames: [DatabaseManaged, DatabaseExternal]
        databaseIncluded:
          type: boolean
        accounts:
          type: array
          description: The console accounts in the backup, which the restore adds.
          items:
            type: string
        clashes:
          type: array
          description: The accounts that exist here too; the backup's account replaces this appliance's.
          items:
            type: string
        components:
          type: array
          items:
            type: string
        dependencies:
          $ref: '#/components/schemas/Dependencies'
          description: >-
            The backup's dependencies, which a fresh restore keeps unless it chooses them anew; nothing is stored
            for them on this appliance yet, so no password, client secret or CA is reported set.
    RestoreStart:
      type: object
      required: [inspection, inPlace, confirm]
      properties:
        inspection:
          type: string
          description: The `inspection` of the summary being confirmed.
        inPlace:
          type: boolean
          description: Restore a local backup onto this appliance instead of onto a fresh one.
        ilmHostName:
          type: string
          description: The ILM host name to set on a fresh restore; left out, the backup's is kept. A restore in place takes only the backup's.
        dependencies:
          $ref: '#/components/schemas/DependenciesUpdate'
          description: >-
            The dependencies a fresh restore chooses instead of the backup's; one left out keeps the backup's. Its
            credentials are always entered. A restore in place keeps the current dependencies and refuses this with 400.
        confirm:
          type: boolean
          description: Must be true; what the appliance holds now is replaced by the backup.
