name: Dispatch Sonar
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]

permissions:
  actions: write # download artifact + create workflow dispatch
  contents: read
  pull-requests: read # confirm the PR number against the trusted head commit

jobs:
  dispatch:
    # Only fork pull requests: pull requests from this repository are scanned in CI itself.
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Download PR context artifact from upstream run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        with:
          name: pr-context
          path: pr_context
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract inputs
        id: ctx
        env:
          # Trusted values from the workflow_run event; the artifact is uploaded by the PR author and is not.
          TRUSTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRUSTED_RUN_ID: ${{ github.event.workflow_run.id }}
          TRUSTED_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          TRUSTED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ctx=pr_context/pr-context.json
          get() { local key="$1"; jq -er --arg key "$key" '.[$key] | strings' "$ctx"; }
          check() { # check <name> <value> <regex>
            local name="$1" value="$2" regex="$3"
            if ! [[ "$value" =~ $regex ]] || [[ "$value" == *..* || "$value" == -* ]]; then
              echo "::error::invalid $name in pr-context.json"
              exit 1
            fi
          }
          pr_number="$(get pr_number)"
          head_repo="$TRUSTED_HEAD_REPO"
          head_branch="$TRUSTED_HEAD_BRANCH"
          check pr_number "$pr_number" '^[0-9]+$'
          # The PR number is only a claim from the artifact: accept it only if that PR's head is the trusted
          # commit and repository, and take its base branch from GitHub rather than from the artifact.
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          if [[ "$(jq -r .head.sha <<<"$pr")" != "$TRUSTED_HEAD_SHA" ||
                "$(jq -r .head.repo.full_name <<<"$pr")" != "$TRUSTED_HEAD_REPO" ]]; then
            echo "::error::pull request $pr_number does not belong to this workflow run"
            exit 1
          fi
          base_ref="$(jq -r .base.ref <<<"$pr")"
          check head_repo "$head_repo" '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
          check head_branch "$head_branch" '^[A-Za-z0-9._/-]+$'
          check base_ref "$base_ref" '^[A-Za-z0-9._/-]+$'
          check head_sha "$TRUSTED_HEAD_SHA" '^[0-9a-f]{40}$'
          check run_id "$TRUSTED_RUN_ID" '^[0-9]+$'
          {
            echo "pr_number=$pr_number"
            echo "head_sha=$TRUSTED_HEAD_SHA"
            echo "head_repo=$head_repo"
            echo "head_branch=$head_branch"
            echo "base_ref=$base_ref"
            echo "run_id=$TRUSTED_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch Sonar workflow with inputs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        # The validated context is passed through env vars and read via process.env, never
        # interpolated into the script body.
        env:
          PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          HEAD_REPO: ${{ steps.ctx.outputs.head_repo }}
          HEAD_BRANCH: ${{ steps.ctx.outputs.head_branch }}
          BASE_REF: ${{ steps.ctx.outputs.base_ref }}
          RUN_ID: ${{ steps.ctx.outputs.run_id }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sonar.yaml',
              // Always run the trusted workflow from the default branch, never a revision the PR names.
              ref: context.payload.repository.default_branch,
              inputs: {
                pr_number:   process.env.PR_NUMBER,
                head_sha:    process.env.HEAD_SHA,
                head_repo:   process.env.HEAD_REPO,
                head_branch: process.env.HEAD_BRANCH,
                base_ref:    process.env.BASE_REF,
                run_id:      process.env.RUN_ID
              }
            });
