name: Build

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull request code never runs with a token that can write packages.
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/images.yaml
    with:
      publish: false

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yaml
    with:
      publish: true
