name: Long tests

# The long boot tests run on demand: when the pull request carries the long-tests label, when someone starts the
# workflow, or when another workflow calls it. They never run with secrets or a token that can write.
on:
  pull_request:
    types: [ labeled, synchronize ]
  workflow_dispatch:
  workflow_call:
    inputs:
      caller-images:
        description: Test the images-amd64 artifact the calling run uploaded instead of building them here.
        type: boolean
        default: false

permissions:
  contents: read

# A push cancels the stale run of the same ref. Labelling a pull request with some other label gets its own group,
# so that its skipped run cannot cancel a running one. A workflow that calls this one must use a group of its own.
concurrency:
  group: long-tests-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'long-tests' && github.run_id || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Builds the amd64 images once, and from a second build of this commit stamped 0.0.0-test the appliance the system
  # update test starts from; the test jobs download them. Pull request runs only go on when the pull request has the
  # label: the label just added, or already there when a push arrives.
  build:
    if: >-
      !inputs.caller-images && (github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && github.event.label.name == 'long-tests')
      || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'long-tests')))
    permissions:
      contents: read
    uses: ./.github/workflows/images.yaml
    with:
      boot: none
      keep-images: true
      bundles: true
      bundle-test-key: true
      arches: '["amd64"]'
      system-update-from: test

  # Builds the amd64 images with ILM 2.19.0 and the platform bundle of the branch, signed with a throw-away key the
  # manager of these images trusts, for the platform update test; like bundle-load, not in a calling run.
  build-old-ilm:
    if: >-
      !inputs.caller-images && (github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && github.event.label.name == 'long-tests')
      || (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'long-tests')))
    permissions:
      contents: read
    uses: ./.github/workflows/images.yaml
    with:
      boot: none
      keep-images: true
      bundle-test-key: true
      arches: '["amd64"]'
      ilm-version: '2.19.0'

  # Loads the platform bundle signed with the build's throw-away key offline; the images of a calling run trust only
  # cosign.pub, so this job needs the build here.
  bundle-load:
    name: bundle load
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      # The unsigned bundle layouts of the images artifact are not needed here.
      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-amd64
          path: out/amd64

      - name: Download the signed platform bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-test-amd64
          path: out/amd64

      - name: Drop the unsigned bundle layouts
        run: rm -rf -- out/amd64/bundles

      - name: Install the boot test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86 ovmf
          fetch() { local output="$1" url="$2"; curl -fsSL --proto '=https' --tlsv1.2 -o "$output" "$url"; }
          dir="$(mktemp -d)"
          version="$(go run github.com/mikefarah/yq/v4@v4.54.1 '.talos.version' release.yaml)"
          base="https://github.com/siderolabs/talos/releases/download/$version"
          fetch "$dir/talosctl-linux-amd64" "$base/talosctl-linux-amd64"
          fetch "$dir/sha256sum.txt" "$base/sha256sum.txt"
          (cd "$dir" && grep ' talosctl-linux-amd64$' sha256sum.txt | sha256sum --check --strict)
          sudo install -m 0755 "$dir/talosctl-linux-amd64" /usr/local/bin/talosctl
          talosctl version --client --short

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is missing or not writable on this runner."
            ls -l /dev/kvm || true
            exit 1
          fi

      - name: Bundle load test
        run: |
          mkdir -p out
          BUNDLE=1 make boot-test MEDIA=iso ARCH=amd64 2>&1 | tee out/boot-test.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-logs-bundle-load
          path: out/boot-test.log
          if-no-files-found: ignore
          retention-days: 3

  # Updates a VM of ILM 2.19.0 to the platform bundle of the branch and rolls the update back.
  platform-update:
    name: platform update
    needs: build-old-ilm
    if: needs.build-old-ilm.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      # The unsigned bundle layouts of the images artifact are not needed here.
      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-amd64-old-ilm
          path: out/amd64

      - name: Download the signed platform bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: platform-update-amd64
          path: out/amd64

      - name: Drop the unsigned bundle layouts
        run: rm -rf -- out/amd64/bundles

      - name: Install the boot test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86 ovmf
          fetch() { local output="$1" url="$2"; curl -fsSL --proto '=https' --tlsv1.2 -o "$output" "$url"; }
          dir="$(mktemp -d)"
          version="$(go run github.com/mikefarah/yq/v4@v4.54.1 '.talos.version' release.yaml)"
          base="https://github.com/siderolabs/talos/releases/download/$version"
          fetch "$dir/talosctl-linux-amd64" "$base/talosctl-linux-amd64"
          fetch "$dir/sha256sum.txt" "$base/sha256sum.txt"
          (cd "$dir" && grep ' talosctl-linux-amd64$' sha256sum.txt | sha256sum --check --strict)
          sudo install -m 0755 "$dir/talosctl-linux-amd64" /usr/local/bin/talosctl
          talosctl version --client --short

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is missing or not writable on this runner."
            ls -l /dev/kvm || true
            exit 1
          fi

      - name: Platform update test
        run: |
          mkdir -p out
          PLATFORM_UPDATE=1 ILM_VERSION=2.19.0 make boot-test MEDIA=iso ARCH=amd64 2>&1 | tee out/boot-test.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-logs-platform-update
          path: out/boot-test.log
          if-no-files-found: ignore
          retention-days: 3

  # Updates a VM of a second build of this commit stamped 0.0.0-test to the system bundle of the branch offline, then
  # reboots it once more with nothing changed; like bundle-load, not in a calling run.
  system-update:
    name: system update
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Download the previous appliance and the signed system bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: system-update-amd64
          path: out/amd64

      - name: Install the boot test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86 ovmf
          fetch() { local output="$1" url="$2"; curl -fsSL --proto '=https' --tlsv1.2 -o "$output" "$url"; }
          dir="$(mktemp -d)"
          version="$(go run github.com/mikefarah/yq/v4@v4.54.1 '.talos.version' release.yaml)"
          base="https://github.com/siderolabs/talos/releases/download/$version"
          fetch "$dir/talosctl-linux-amd64" "$base/talosctl-linux-amd64"
          fetch "$dir/sha256sum.txt" "$base/sha256sum.txt"
          (cd "$dir" && grep ' talosctl-linux-amd64$' sha256sum.txt | sha256sum --check --strict)
          sudo install -m 0755 "$dir/talosctl-linux-amd64" /usr/local/bin/talosctl
          talosctl version --client --short

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is missing or not writable on this runner."
            ls -l /dev/kvm || true
            exit 1
          fi

      - name: System update test
        run: |
          mkdir -p out
          SYSTEM_UPDATE=1 FROM=test make boot-test MEDIA=qcow2 ARCH=amd64 2>&1 | tee out/boot-test.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-logs-system-update
          path: out/boot-test.log
          if-no-files-found: ignore
          retention-days: 3

  # With caller-images the build job is skipped and the images come from the calling run.
  restore:
    name: restore
    needs: build
    if: always() && (needs.build.result == 'success' || (inputs.caller-images && needs.build.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: test/e2e/package-lock.json

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      # The images job uploads out/amd64/*.iso, *.qcow2, SHA256SUMS and bundles/; the artifact keeps them relative to
      # out/amd64.
      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images-amd64
          path: out/amd64

      - name: Install the boot test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils qemu-system-x86 ovmf
          fetch() { local output="$1" url="$2"; curl -fsSL --proto '=https' --tlsv1.2 -o "$output" "$url"; }
          dir="$(mktemp -d)"
          version="$(go run github.com/mikefarah/yq/v4@v4.54.1 '.talos.version' release.yaml)"
          base="https://github.com/siderolabs/talos/releases/download/$version"
          fetch "$dir/talosctl-linux-amd64" "$base/talosctl-linux-amd64"
          fetch "$dir/sha256sum.txt" "$base/sha256sum.txt"
          (cd "$dir" && grep ' talosctl-linux-amd64$' sha256sum.txt | sha256sum --check --strict)
          sudo install -m 0755 "$dir/talosctl-linux-amd64" /usr/local/bin/talosctl
          talosctl version --client --short

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is missing or not writable on this runner."
            ls -l /dev/kvm || true
            exit 1
          fi

      - name: Install the browser test
        working-directory: test/e2e
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      # Two VMs one after the other: the second restores the first one's backup.
      - name: Restore test
        run: |
          mkdir -p out
          E2E=1 RESTORE=1 make boot-test MEDIA=iso ARCH=amd64 2>&1 | tee out/boot-test.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-logs-restore
          path: out/boot-test.log
          if-no-files-found: ignore
          retention-days: 3
