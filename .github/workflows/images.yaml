name: Images

on:
  workflow_call:
    inputs:
      publish:
        description: Push the intermediate images to GHCR and keep the images as artifacts.
        type: boolean
        default: false
      keep-images:
        description: Keep the amd64 and arm64 images as artifacts without publishing them.
        type: boolean
        default: false
      boot:
        description: "quick runs the boot test with the browser test on the amd64 ISO; none skips it."
        type: string
        default: quick
      bundles:
        description: Also build the unsigned system and platform bundles and keep them with the images.
        type: boolean
        default: false
      bundle-test-key:
        description: >-
          Build the manager trusting a throw-away bundle key made in the job instead of cosign.pub, and sign with it
          the platform bundle of the boot test, kept as the bundle-test-<arch> artifact. For the long tests only, amd64
          only, never with publish.
        type: boolean
        default: false
      arches:
        description: JSON array of the architectures to build.
        type: string
        default: '["amd64","arm64"]'
      ilm-version:
        description: >-
          Build the images with this older ILM version instead of release.yaml's, for the platform update test. With
          bundle-test-key the platform bundle of release.yaml is signed instead, without changing its ILM version, and
          kept as the platform-update-<arch> artifact; the images artifact is images-<arch>-old-ilm.
        type: string
        default: ''
      system-update-from:
        description: >-
          With bundle-test-key, also sign the system bundle of these images with the throw-away key and build the qcow2
          of the appliance the system update test starts from, a tag, or test for this commit stamped 0.0.0-test,
          trusting that key; both are kept as the system-update-<arch> artifact.
        type: string
        default: ''

defaults:
  run:
    shell: bash

jobs:
  images:
    name: images (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    env:
      ARCH: ${{ matrix.arch }}
      REGISTRY: ${{ inputs.publish && 'ghcr.io/omnitrustilm/appliance-ng' || 'localhost:5005' }}
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5005:5000
    steps:
      # A system update test from a tag builds that tag.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: ${{ (inputs.system-update-from == '' || inputs.system-update-from == 'test') && 1 || 0 }}

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      # build/manager.sh builds the console, which the manager embeds.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            test/e2e/package-lock.json

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils zstd
          fetch() { local output="$1" url="$2"; curl -fsSL --proto '=https' --tlsv1.2 -o "$output" "$url"; }
          dir="$(mktemp -d)"
          crane_asset="go-containerregistry_Linux_$([ "$ARCH" = amd64 ] && echo x86_64 || echo arm64).tar.gz"
          crane_base="https://github.com/google/go-containerregistry/releases/download/v0.20.6"
          fetch "$dir/$crane_asset" "$crane_base/$crane_asset"
          fetch "$dir/checksums.txt" "$crane_base/checksums.txt"
          (cd "$dir" && grep " $crane_asset\$" checksums.txt | sha256sum --check --strict)
          tar -xzf "$dir/$crane_asset" -C "$dir" crane
          sudo install -m 0755 "$dir/crane" /usr/local/bin/crane
          version="$(go run github.com/mikefarah/yq/v4@v4.54.1 '.talos.version' release.yaml)"
          base="https://github.com/siderolabs/talos/releases/download/$version"
          fetch "$dir/talosctl-linux-$ARCH" "$base/talosctl-linux-$ARCH"
          fetch "$dir/sha256sum.txt" "$base/sha256sum.txt"
          (cd "$dir" && grep " talosctl-linux-$ARCH\$" sha256sum.txt | sha256sum --check --strict)
          sudo install -m 0755 "$dir/talosctl-linux-$ARCH" /usr/local/bin/talosctl
          talosctl version --client --short

      - name: Enable KVM
        if: matrix.arch == 'amd64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is missing or not writable on this runner."
            ls -l /dev/kvm || true
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The private key stays in this job; the manager built next trusts only the public key.
      - name: Make a throw-away bundle key
        if: inputs.bundle-test-key
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "$PUBLISH" = true ] || [ "$ARCH" != amd64 ]; then
            echo "::error::A bundle test key is made only for amd64 images that are not published."
            exit 1
          fi
          fetch() { local output="$1" url="$2"; curl -fsSL --proto '=https' --tlsv1.2 -o "$output" "$url"; }
          dir="$(mktemp -d)"
          fetch "$dir/oras.tar.gz" https://github.com/oras-project/oras/releases/download/v1.4.0/oras_1.4.0_linux_amd64.tar.gz
          fetch "$dir/cosign" https://github.com/sigstore/cosign/releases/download/v3.0.2/cosign-linux-amd64
          sha256sum --check --strict <<EOF
          d8e1dce2fd8ce996f1d901845b688eb0cf505a6082897606f053825bb47935d1  $dir/oras.tar.gz
          46dbdcb5467a3dfec2526923d0b3365e40c8d9dc00ec23d5aca3437449e8cbfd  $dir/cosign
          EOF
          tar -xzf "$dir/oras.tar.gz" -C "$dir" oras
          sudo install -m 0755 "$dir/oras" "$dir/cosign" /usr/local/bin/
          key="$RUNNER_TEMP/bundle-key"
          mkdir -p "$key"
          (cd "$key" && COSIGN_PASSWORD='' cosign generate-key-pair)
          echo "BUNDLE_TEST_KEY=$(base64 -w0 "$key/cosign.pub")" >>"$GITHUB_ENV"

      # Signed before the images pin the older ILM version into release.yaml and the add-on files.
      - name: Sign the platform update test's bundle
        if: inputs.bundle-test-key && inputs.ilm-version != ''
        run: |
          SAME_ILM=1 COSIGN_PASSWORD='' ./test/boot/bundle.sh "$ARCH" "$RUNNER_TEMP/bundle-key/cosign.key" \
            "out/$ARCH/platform-update.tar"

      - name: Build images
        env:
          ILM_VERSION: ${{ inputs.ilm-version }}
        run: make images ARCH="$ARCH" REGISTRY="$REGISTRY"

      # A published manager must trust only cosign.pub: no base64 PEM public key may be linked into it.
      - name: Check the manager has no bundle test key
        if: inputs.publish
        run: |
          test -s "out/$ARCH/manager/manager" || { echo "::error::out/$ARCH/manager/manager is missing or empty."; exit 1; }
          if LC_ALL=C grep -q -a 'LS0tLS1CRUdJTiBQVUJMSUMgS0VZ' "out/$ARCH/manager/manager"; then
            echo "::error::The manager binary holds a base64 PEM public key, a bundle test key."
            exit 1
          fi

      - name: Build bundles
        if: inputs.bundles
        run: make bundles ARCH="$ARCH"

      # Signs in the local registry service, without a transparency log, and deletes the private key.
      - name: Sign the boot test's platform bundle
        if: inputs.bundle-test-key && inputs.ilm-version == ''
        run: |
          COSIGN_PASSWORD='' ./test/boot/bundle.sh "$ARCH" "$RUNNER_TEMP/bundle-key/cosign.key" \
            "out/$ARCH/platform-test.tar"

      # The system bundle carries the installer and the manager this job built and pushed.
      - name: Sign the system update test's bundle
        if: inputs.bundle-test-key && inputs.system-update-from != ''
        run: |
          KIND=system COSIGN_PASSWORD='' ./test/boot/bundle.sh "$ARCH" "$RUNNER_TEMP/bundle-key/cosign.key" \
            "out/$ARCH/system-update.tar"

      - name: Delete the throw-away bundle key
        if: always() && inputs.bundle-test-key
        run: rm -rf -- "$RUNNER_TEMP/bundle-key"

      # A second image build in a throw-away worktree; it shares the image layer cache of the first.
      - name: Build the appliance the system update test starts from
        if: inputs.bundle-test-key && inputs.system-update-from != ''
        env:
          FROM: ${{ inputs.system-update-from }}
        run: ./test/boot/previous.sh "$FROM" "$ARCH"

      # The boot test answers the wizard and changes settings in Chromium; the browser leaves no trace, video or
      # screenshot to upload. Only lock-file packages run here, after the registry log-in: CI type-checks the test
      # and checks its licences.
      - name: Install the browser test
        if: matrix.arch == 'amd64' && inputs.boot == 'quick'
        working-directory: test/e2e
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      # The restore run, which boots a second VM, is in long-tests.yaml.
      - name: Boot test
        if: matrix.arch == 'amd64' && inputs.boot == 'quick'
        run: E2E=1 make boot-test MEDIA=iso ARCH=amd64 2>&1 | tee out/boot-test.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-logs-${{ matrix.arch }}
          path: |
            out/boot-test.log
            out/*/imager-*.log
          if-no-files-found: ignore
          retention-days: 3

      # The digests the build pushed, so that a release bundles exactly these images even when the tags move on.
      - name: Upload the pushed digests
        if: inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}/installer.digest
            out/${{ matrix.arch }}/manager.digest
          if-no-files-found: error
          retention-days: 3

      - name: Upload images
        if: inputs.publish || inputs.keep-images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: images-${{ matrix.arch }}${{ inputs.ilm-version != '' && '-old-ilm' || '' }}
          path: |
            out/${{ matrix.arch }}/*.iso
            out/${{ matrix.arch }}/*.qcow2
            out/${{ matrix.arch }}/SHA256SUMS
            out/${{ matrix.arch }}/bundles/
          retention-days: 3

      - name: Upload the boot test's platform bundle
        if: inputs.bundle-test-key && inputs.ilm-version == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-test-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/platform-test.tar
          if-no-files-found: error
          retention-days: 3

      - name: Upload the system update test's appliance and bundle
        if: inputs.bundle-test-key && inputs.system-update-from != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-update-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}/system-update.tar
            out/${{ matrix.arch }}/previous/
          if-no-files-found: error
          retention-days: 3

      - name: Upload the platform update test's bundle
        if: inputs.bundle-test-key && inputs.ilm-version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-update-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/platform-update.tar
          if-no-files-found: error
          retention-days: 3
