name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Verify generated files are up to date
        run: |
          make generate manifests
          git diff --exit-code api config addons/manager.yaml release.yaml
          untracked="$(git status --porcelain -- api config addons/manager.yaml release.yaml)"
          if [ -n "$untracked" ]; then
            echo "::error::Regeneration produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install console dependencies
        run: npm ci
        working-directory: web
      # make test downloads the envtest Kubernetes binaries through setup-envtest; its console tests write the
      # lcov report that the SonarCloud scan reads.
      - name: Run tests with coverage
        run: make test
      # cmd/ only wires flags and the controller manager to internal/ and is excluded from coverage, as in sonar-project.properties; so are generated code (zz_generated*.go, gen.go) and the boot test driver (test/boot/), which the boot test runs.
      - name: Verify coverage threshold
        run: |
          grep -v -e '/cmd/' -e '/zz_generated' -e '/gen\.go:' -e '/test/boot/' coverage.out > coverage-internal.out
          total=$(go tool cover -func=coverage-internal.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "Total coverage: ${total}%"
          if [ "$(echo "$total < 80" | bc)" -eq 1 ]; then
            echo "::error::Coverage ${total}% is below the 80% threshold"
            exit 1
          fi
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          # Both paths keep their place relative to the repository root, where the Sonar workflow restores them.
          path: |
            coverage.out
            web/coverage/lcov.info
          if-no-files-found: error
      - name: Prepare PR context artifact
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          jq -n '{pr_number: env.PR_NUMBER, head_sha: env.HEAD_SHA, head_repo: env.HEAD_REPO,
            head_branch: env.HEAD_BRANCH, base_ref: env.BASE_REF, run_id: env.RUN_ID}' > pr-context.json
      - name: Upload PR context
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-context
          path: pr-context.json
          retention-days: 1
          if-no-files-found: error
      # Pushes to main and pull requests from branches of this repository have the secrets and trusted code,
      # so they scan here; fork pull requests are scanned by the Dispatch Sonar workflow.
      - name: SonarCloud Scan
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify generated API files are up to date
        working-directory: .
        run: |
          make api-gen
          git diff --exit-code internal/api web/src/api
          untracked="$(git status --porcelain -- internal/api web/src/api)"
          if [ -n "$untracked" ]; then
            echo "::error::Regeneration produced files that are not committed:"
            echo "$untracked"
            exit 1
          fi
      - name: Lint
        run: npm run lint
      # vite.config.ts enforces the 80% coverage threshold.
      - name: Run tests with coverage
        run: npm test -- --coverage
      - name: Build
        run: npm run build
      - name: Check licences of the shipped dependencies
        run: npm run licenses
      - name: Check licences of the build-time dependencies
        run: npm run licenses:dev

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12

  addons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Validate release manifest against the add-ons
        run: go run ./cmd/release validate
      - name: Start a Kubernetes 1.37 cluster
        run: >-
          go run sigs.k8s.io/kind@v0.33.0 create cluster --wait 2m
          --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      # Talos serves its ServiceAccount resource itself; kind gets a stand-in with the same schema for manager.yaml.
      - name: Add the Talos ServiceAccount resource
        run: |
          kubectl apply --server-side -f - <<'YAML'
          apiVersion: apiextensions.k8s.io/v1
          kind: CustomResourceDefinition
          metadata:
            name: serviceaccounts.talos.dev
          spec:
            group: talos.dev
            names: {kind: ServiceAccount, listKind: ServiceAccountList, plural: serviceaccounts, singular: serviceaccount}
            scope: Namespaced
            versions:
              - name: v1alpha1
                served: true
                storage: true
                schema:
                  openAPIV3Schema:
                    type: object
                    properties:
                      spec:
                        type: object
                        properties:
                          roles: {type: array, items: {type: string}}
          YAML
      # A client dry run validates no fields, so every file is dry-run on the server instead.
      # Namespaces and CRDs are created for real first, as the earlier steps would have.
      - name: Dry-run every add-on manifest
        run: |
          files=$(find addons -maxdepth 1 -name '*.yaml' ! -name order.yaml | sort)
          # shellcheck disable=SC2086
          go run github.com/mikefarah/yq/v4@v4.54.1 'select(.kind == "Namespace" or .kind == "CustomResourceDefinition")' $files |
            kubectl apply --server-side -f - >/dev/null
          kubectl wait --for condition=Established crd --all --timeout 2m
          for file in $files; do
            kubectl apply --server-side --force-conflicts --dry-run=server -f "$file" >/dev/null
          done
